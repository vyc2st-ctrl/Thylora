<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
<!-- THYLORA merch front print, equation-first (THY-MERCH-EQUATION-FIRST-001). Print area 12x15 in @100dpi. DRAFT for Chairman review. Rev 660. -->
<rect width="1200" height="1500" fill="#1b1b1b"/>
<text x="600" y="300" text-anchor="middle" font-family="STIX Two Text, Cambria Math, serif" font-size="150" fill="#f5f1e8">G = P × M × E × D</text>
<line x1="60" y1="380" x2="1140" y2="380" stroke="#f5f1e8" stroke-width="3"/>
<text x="60" y="470" font-family="STIX Two Text, Cambria Math, serif" font-style="italic" font-size="40" fill="#f5f1e8">G</text><text x="130" y="470" font-family="Inter, Arial, sans-serif" font-size="30" fill="#f5f1e8">how far you get</text><text x="60" y="528" font-family="STIX Two Text, Cambria Math, serif" font-style="italic" font-size="40" fill="#f5f1e8">P</text><text x="130" y="528" font-family="Inter, Arial, sans-serif" font-size="30" fill="#f5f1e8">purpose</text><text x="60" y="586" font-family="STIX Two Text, Cambria Math, serif" font-style="italic" font-size="40" fill="#f5f1e8">M</text><text x="130" y="586" font-family="Inter, Arial, sans-serif" font-size="30" fill="#f5f1e8">method</text><text x="60" y="644" font-family="STIX Two Text, Cambria Math, serif" font-style="italic" font-size="40" fill="#f5f1e8">E</text><text x="130" y="644" font-family="Inter, Arial, sans-serif" font-size="30" fill="#f5f1e8">evidence</text><text x="60" y="702" font-family="STIX Two Text, Cambria Math, serif" font-style="italic" font-size="40" fill="#f5f1e8">D</text><text x="130" y="702" font-family="Inter, Arial, sans-serif" font-size="30" fill="#f5f1e8">discipline</text>
<text x="600" y="850" text-anchor="middle" font-family="STIX Two Text, Cambria Math, serif" font-size="56" fill="#f5f1e8">a zero anywhere is a zero everywhere</text>
<text x="600" y="1420" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" letter-spacing="6" fill="#f5f1e8">THYLORA</text>
