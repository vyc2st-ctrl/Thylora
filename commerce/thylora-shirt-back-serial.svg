<?xml version="1.0" encoding="UTF-8"?>
<!--
  THYLORA · FIRST SHIRT · BACK NECK SERIAL MASTER
  Canvas: 1200 x 600 px = 4.00in x 2.00in at 300 dpi.
  Placement: centred, 3.0in below the back collar seam.
  Same preflight applies: outline the text, delete the preflight layer,
  export 300 dpi PNG with a transparent background.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" version="1.1">
  <title>THYLORA back neck serial</title>
  <defs>
    <style>
      .micro { font-family: "IBM Plex Mono", "Courier New", monospace; font-weight: 500; }
      .sub   { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; font-weight: 600; }
    </style>
  </defs>
  <g id="artwork">
    <g transform="translate(600 150) scale(0.42)">
      <circle cx="0" cy="0" r="150" fill="none" stroke="#F2EDE3" stroke-width="42"/>
      <line x1="-138" y1="-72" x2="138" y2="-72" stroke="#F2EDE3" stroke-width="20" stroke-linecap="round"/>
      <line x1="-150" y1="0"   x2="150" y2="0"   stroke="#F2EDE3" stroke-width="20" stroke-linecap="round"/>
      <line x1="-138" y1="72"  x2="138" y2="72"  stroke="#F2EDE3" stroke-width="20" stroke-linecap="round"/>
      <ellipse cx="0" cy="0" rx="58" ry="150" fill="none" stroke="#F2EDE3" stroke-width="20"/>
    </g>
    <text class="sub"   x="600" y="290" font-size="64" fill="#F2EDE3" text-anchor="middle" letter-spacing="20">THYLORA</text>
    <text class="micro" x="600" y="380" font-size="40" fill="#F2EDE3" text-anchor="middle" opacity="0.8" letter-spacing="8">ERSATZREALITY · VYC2ST</text>
    <text class="micro" x="600" y="470" font-size="46" fill="#F2EDE3" text-anchor="middle" letter-spacing="10">THY-G-001-0001</text>
    <text class="micro" x="600" y="540" font-size="32" fill="#F2EDE3" text-anchor="middle" opacity="0.65" letter-spacing="6">FIRST SAMPLE · 2026</text>
  </g>
  <g id="preflight" opacity="0.5">
    <rect x="0" y="0" width="1200" height="600" fill="none" stroke="#FF3B30" stroke-width="4" stroke-dasharray="20 12"/>
    <text class="micro" x="14" y="40" font-size="30" fill="#FF3B30">4in x 2in @300dpi — DELETE THIS LAYER BEFORE UPLOAD</text>
  </g>
</svg>
