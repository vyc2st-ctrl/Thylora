family='"Liberation Sans", Arial, sans-serif' font-size="8.4" font-weight="700" font-style="normal" letter-spacing="2.2" xml:space="preserve">THYLORA STANDARDS SERIES · 01</text><text x="54" y="276" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="62" font-weight="700" font-style="normal" xml:space="preserve">QYRIS</text><text x="54" y="333.04" fill="rgb(224,179,91)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="62" font-weight="700" font-style="normal" xml:space="preserve">QuickCheck</text><path d="M54 363.04 L146 363.04" fill="none" stroke="rgb(224,179,91)" stroke-width="2"/><text x="54" y="389.04" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="700" font-style="normal" letter-spacing="3" xml:space="preserve">THE NINE-INSPECTION PASS</text><text x="54" y="423.04" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="17" font-weight="400" font-style="normal" xml:space="preserve">Twelve minutes. Nine questions. One page you can hand to anyone.</text><text x="54" y="455.34" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.4" font-weight="400" font-style="normal" xml:space="preserve">A review asks whether something is good. A QuickCheck asks whether anything is</text><text x="54" y="471.148" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.4" font-weight="400" font-style="normal" xml:space="preserve">missing, unowned, unproven or unrecoverable — and then routes it.</text><path d="M64 646.108 L548 646.108 C553.523 646.108 558 641.631 558 636.108 L558 506.108 C558 500.585 553.523 496.108 548 496.108 L64 496.108 C58.477 496.108 54 500.585 54 506.108 L54 636.108 C54 641.631 58.477 646.108 64 646.108 Z" fill="rgb(17,24,35)" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="72" y="514.108" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.8" font-weight="700" font-style="normal" letter-spacing="2.2" xml:space="preserve">INSIDE</text><text x="72" y="530.108" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8" font-weight="700" font-style="normal" xml:space="preserve">00</text><text x="94" y="530.108" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="400" font-style="normal" xml:space="preserve">How to run the pass</text><text x="72" y="552.108" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8" font-weight="700" font-style="normal" xml:space="preserve">01</text><text x="94" y="552.108" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="400" font-style="normal" xml:space="preserve">Missing prerequisite · Hidden handoff</text><text x="72" y="574.108" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8" font-weight="700" font-style="normal" xml:space="preserve">02</text><text x="94" y="574.108" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="400" font-style="normal" xml:space="preserve">Authority mismatch · Evidence gap</text><text x="72" y="596.108" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8" font-weight="700" font-style="normal" xml:space="preserve">03</text><text x="94" y="596.108" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="400" font-style="normal" xml:space="preserve">Unnecessary waiting · Customer friction</text><text x="72" y="618.108" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8" font-weight="700" font-style="normal" xml:space="preserve">04</text><text x="94" y="618.108" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="400" font-style="normal" xml:space="preserve">Rights and privacy risk · Value left on the table</text><text x="313" y="530.108" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8" font-weight="700" font-style="normal" xml:space="preserve">05</text><text x="335" y="530.108" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="400" font-style="normal" xml:space="preserve">Failure and recovery · Disposition</text><text x="313" y="552.108" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8" font-weight="700" font-style="normal" xml:space="preserve">06</text><text x="335" y="552.108" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="400" font-style="normal" xml:space="preserve">Scoring and the readiness line</text><text x="313" y="574.108" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8" font-weight="700" font-style="normal" xml:space="preserve">07</text><text x="335" y="574.108" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="400" font-style="normal" xml:space="preserve">Five ways a pass goes weak</text><text x="313" y="596.108" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8" font-weight="700" font-style="normal" xml:space="preserve">—</text><text x="335" y="596.108" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="400" font-style="normal" xml:space="preserve">Worked example · a launch, filled in</text><text x="313" y="618.108" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8" font-weight="700" font-style="normal" xml:space="preserve">—</text><text x="335" y="618.108" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="400" font-style="normal" xml:space="preserve">The QuickCheck Sheet · fillable, reusable</text><path d="M0 716h612v76h-612Z" fill="rgb(8,12,18)" stroke="none" stroke-width="0.7"/><path d="M0 716 L612 716" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="54" y="738" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.4" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">SERIAL</text><text x="54" y="754" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="12" font-weight="700" font-style="normal" letter-spacing="0.6" xml:space="preserve">THY-QC1-0000-MASTER</text><text x="453.27" y="738" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.4" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">FIRST EDITION · V1.0</text><text x="461.387" y="754" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11" font-weight="400" font-style="normal" xml:space="preserve">22 September 2026</text></svg></div></div><div class="pg" data-page="2" style="width:612px;height:792px"><div style="transform:scale(1);transform-origin:0 0;width:612px;height:792px"><svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792"><path d="M0 0h612v792h-612Z" fill="rgb(10,14,20)" stroke="none" stroke-width="1"/><path d="M0 0h612v3h-612Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1"/><text x="54" y="30" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">QYRIS QUICKCHECK</text><text x="511.191" y="30" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">PLATE 00</text><path d="M54 38 L558 38" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="376" y="734" fill="rgb(24,34,47)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="190" font-weight="700" font-style="normal" xml:space="preserve">00</text><path d="M54.35 58.349999999999966h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M61.683 58.349999999999966h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M69.017 58.349999999999966h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M54.35 65.68300000000005h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M61.333 65.33299999999996h6.087v6.087h-6.087Z" fill="rgb(224,179,91)" stroke="none" stroke-width="0.7"/><path d="M69.017 65.68300000000005h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M54.35 73.01600000000002h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M61.683 73.01600000000002h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M69.017 73.01600000000002h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><text x="88" y="74" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7" font-weight="700" font-style="normal" letter-spacing="2.2" xml:space="preserve">BEFORE YOU START</text><text x="54" y="122" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="30" font-weight="700" font-style="normal" xml:space="preserve">How to run the pass</text><text x="54" y="148" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">Nine inspections, roughly a minute each, then one readiness line. Twelve minutes on your own.</text><text x="54" y="163.80999999999995" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">Twenty-five with a room. Run it at the start of a thing, again the week before it ships, and again</text><text x="54" y="179.62" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">the week after it is live — and keep all three sheets.</text><path d="M54 191.86 L100 191.86" fill="none" stroke="rgb(224,179,91)" stroke-width="1.6"/><text x="54" y="223.03999999999996" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.4" font-weight="700" font-style="normal" xml:space="preserve">01</text><text x="81" y="223.03999999999996" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11" font-weight="700" font-style="normal" xml:space="preserve">One pass, everything at once</text><text x="81" y="239.03999999999996" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.6" font-weight="400" font-style="normal" xml:space="preserve">Report every gap you find in a single pass. Handing someone one problem at a time costs them a round trip per</text><text x="81" y="253.44000000000005" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.6" font-weight="400" font-style="normal" xml:space="preserve">problem, and it teaches them to dread the next one.</text><text x="54" y="275.52" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.4" font-weight="700" font-style="normal" xml:space="preserve">02</text><text x="81" y="275.52" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11" font-weight="700" font-style="normal" xml:space="preserve">Name the route, not just the gap</text><text x="81" y="291.52" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.6" font-weight="400" font-style="normal" xml:space="preserve">A gap with no route is not a finding, it is a complaint. Every line gets a next action with an owner and a date, or a</text><text x="81" y="305.92" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.6" font-weight="400" font-style="normal" xml:space="preserve">named authority it waits on.</text><text x="54" y="328" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.4" font-weight="700" font-style="normal" xml:space="preserve">03</text><text x="81" y="328" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11" font-weight="700" font-style="normal" xml:space="preserve">Held is honest. Silent is not</text><text x="81" y="344" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.6" font-weight="400" font-style="normal" xml:space="preserve">If closing a gap needs an authority you do not have — money, a signature, an account, another person — write</text><text x="81" y="358.4" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.6" font-weight="400" font-style="normal" xml:space="preserve">HELD and name what it waits on. Never quietly drop it.</text><text x="54" y="380.48" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.4" font-weight="700" font-style="normal" xml:space="preserve">04</text><text x="81" y="380.48" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11" font-weight="700" font-style="normal" xml:space="preserve">Evidence outranks assertion</text><text x="81" y="396.48" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.6" font-weight="400" font-style="normal" xml:space="preserve">“Done” is a claim. A date, a reference, a receipt, a passing test is proof. Where there is no proof, the disposition</text><text x="81" y="410.88" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.6" font-weight="400" font-style="normal" xml:space="preserve">is OPEN, however confident the room sounds.</text><path d="M62 552.3 L328.24 552.3 C332.658 552.3 336.24 548.718 336.24 544.3 L336.24 446.96 C336.24 442.542 332.658 438.96 328.24 438.96 L62 438.96 C57.582 438.96 54 442.542 54 446.96 L54 544.3 C54 548.718 57.582 552.3 62 552.3 Z" fill="rgb(13,19,28)" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="68" y="455.96" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.4" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">WHEN TO RUN IT</text><text x="68" y="471.96" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="78" y="471.96" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">Before you ship, sign, pay or promise a date.</text><text x="68" y="488.428" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="78" y="488.428" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">When something has been “nearly ready” for the third week</text><text x="78" y="501.896" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">running.</text><text x="68" y="518.364" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="78" y="518.364" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">After anything reached a customer that should not have.</text><text x="68" y="534.832" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="78" y="534.832" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">Before you tell anyone outside that a thing is live.</text><path d="M360.24 522.56 L550 522.56 C554.418 522.56 558 518.9780000000001 558 514.56 L558 446.96 C558 442.542 554.418 438.96 550 438.96 L360.24 438.96 C355.822 438.96 352.24 442.542 352.24 446.96 L352.24 514.56 C352.24 518.9780000000001 355.822 522.56 360.24 522.56 Z" fill="rgb(17,24,35)" stroke="rgb(138,100,21)" stroke-width="0.8"/><text x="366.24" y="456.96" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.4" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">IF YOU ONLY HAVE FOUR MINUTES</text><text x="366.24" y="474.96" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="normal" xml:space="preserve">Run inspection 4 and inspection 9. Unproven</text><text x="366.24" y="488.16" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="normal" xml:space="preserve">claims and untested recovery are what</text><text x="366.24" y="501.36" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="normal" xml:space="preserve">actually reach customers.</text><path d="M54 750 L558 750" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="54" y="763" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">THY-QYRIS-QC-001  ·  THY-QC1-0000-MASTER</text><text x="536.638" y="763" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">2 / 12</text></svg></div></div><div class="pg" data-page="3" style="width:612px;height:792px"><div style="transform:scale(1);transform-origin:0 0;width:612px;height:792px"><svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792"><path d="M0 0h612v792h-612Z" fill="rgb(10,14,20)" stroke="none" stroke-width="1"/><path d="M0 0h612v3h-612Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1"/><text x="54" y="30" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">QYRIS QUICKCHECK</text><text x="511.191" y="30" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">PLATE 01</text><path d="M54 38 L558 38" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="376" y="734" fill="rgb(24,34,47)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="190" font-weight="700" font-style="normal" xml:space="preserve">01</text><path d="M54.35 58.349999999999966h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M61.683 58.349999999999966h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M69.017 58.349999999999966h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M54.35 65.68300000000005h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M61.333 65.33299999999996h6.087v6.087h-6.087Z" fill="rgb(224,179,91)" stroke="none" stroke-width="0.7"/><path d="M69.017 65.68300000000005h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M54.35 73.01600000000002h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M61.683 73.01600000000002h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M69.017 73.01600000000002h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><text x="88" y="74" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7" font-weight="700" font-style="normal" letter-spacing="2.2" xml:space="preserve">INSPECTION 1 AND 2</text><text x="54" y="122" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="30" font-weight="700" font-style="normal" xml:space="preserve">Missing prerequisite · Hidden handoff</text><path d="M54 138.82000000000005 L100 138.82000000000005" fill="none" stroke="rgb(224,179,91)" stroke-width="1.6"/><path d="M57 182.17999999999995 L70 182.17999999999995 C71.657 182.17999999999995 73 180.837 73 179.17999999999995 L73 166.17999999999995 C73 164.52300000000002 71.657 163.17999999999995 70 163.17999999999995 L57 163.17999999999995 C55.343 163.17999999999995 54 164.52300000000002 54 166.17999999999995 L54 179.17999999999995 C54 180.837 55.343 182.17999999999995 57 182.17999999999995 Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1.6"/><text x="60.225" y="176.86" fill="rgb(10,14,20)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11.78" font-weight="700" font-style="normal" xml:space="preserve">1</text><text x="83" y="178" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="18.5" font-weight="700" font-style="normal" xml:space="preserve">Missing prerequisite</text><text x="54" y="204" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11.2" font-weight="400" font-style="italic" xml:space="preserve">What must already be true for this to work —</text><text x="54" y="220.79999999999995" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11.2" font-weight="400" font-style="italic" xml:space="preserve">and is any of it merely assumed?</text><text x="54" y="242.08000000000004" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="1.8" xml:space="preserve">SOUNDS LIKE</text><text x="54" y="258.08000000000004" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="64" y="258.08000000000004" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">“We’ll sort that out at the end.”</text><text x="54" y="271.144" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="64" y="271.144" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">“It usually just works.”</text><text x="54" y="284.208" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="64" y="284.208" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">“Someone must have done that by now.”</text><text x="54" y="302.332" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="1.8" xml:space="preserve">THE ROUTE</text><text x="54" y="318.332" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">List every precondition in one place. For each, name</text><text x="54" y="333.836" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">the thing that checks it. Where nothing checks it,</text><text x="54" y="349.34" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">that check is the work — and it belongs before the</text><text x="54" y="364.844" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">step it protects, not after.</text><path d="M59 418.974 L286 418.974 C288.762 418.974 291 416.736 291 413.974 L291 378.714 C291 375.953 288.762 373.714 286 373.714 L59 373.714 C56.239 373.714 54 375.953 54 378.714 L54 413.974 C54 416.736 56.239 418.974 59 418.974 Z" fill="rgb(17,24,35)" stroke="none" stroke-width="1.6"/><path d="M54 373.714h2.6v45.26h-2.6Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1.6"/><text x="68" y="387.714" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.4" font-weight="700" font-style="normal" xml:space="preserve">Can you point at the thing that refuses to</text><text x="68" y="401.344" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.4" font-weight="700" font-style="normal" xml:space="preserve">proceed when the precondition is missing?</text><path d="M324 182.17999999999995 L337 182.17999999999995 C338.657 182.17999999999995 340 180.837 340 179.17999999999995 L340 166.17999999999995 C340 164.52300000000002 338.657 163.17999999999995 337 163.17999999999995 L324 163.17999999999995 C322.343 163.17999999999995 321 164.52300000000002 321 166.17999999999995 L321 179.17999999999995 C321 180.837 322.343 182.17999999999995 324 182.17999999999995 Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1.6"/><text x="327.225" y="176.86" fill="rgb(10,14,20)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11.78" font-weight="700" font-style="normal" xml:space="preserve">2</text><text x="350" y="178" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="18.5" font-weight="700" font-style="normal" xml:space="preserve">Hidden handoff</text><text x="321" y="204" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11.2" font-weight="400" font-style="italic" xml:space="preserve">Where does this pass between people, teams</text><text x="321" y="220.79999999999995" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11.2" font-weight="400" font-style="italic" xml:space="preserve">or systems with no record of the pass?</text><text x="321" y="242.08000000000004" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="1.8" xml:space="preserve">SOUNDS LIKE</text><text x="321" y="258.08000000000004" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="331" y="258.08000000000004" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">“I sent it over.”</text><text x="321" y="271.144" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="331" y="271.144" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">“It’s with them now.”</text><text x="321" y="284.208" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="331" y="284.208" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">“I thought you had it.”</text><text x="321" y="302.332" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="1.8" xml:space="preserve">THE ROUTE</text><text x="321" y="318.332" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">Give every handoff a record written by the system,</text><text x="321" y="333.836" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">not by memory: who moved it, when, out of what</text><text x="321" y="349.34" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">state and into what state. A trail nobody has to be</text><text x="321" y="364.844" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">present to reconstruct.</text><path d="M326 418.974 L553 418.974 C555.762 418.974 558 416.736 558 413.974 L558 378.714 C558 375.953 555.762 373.714 553 373.714 L326 373.714 C323.239 373.714 321 375.953 321 378.714 L321 413.974 C321 416.736 323.239 418.974 326 418.974 Z" fill="rgb(17,24,35)" stroke="none" stroke-width="1.6"/><path d="M321 373.714h2.6v45.26h-2.6Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1.6"/><text x="335" y="387.714" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.4" font-weight="700" font-style="normal" xml:space="preserve">If everyone involved were unreachable</text><text x="335" y="401.344" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.4" font-weight="700" font-style="normal" xml:space="preserve">tomorrow, could a stranger say where this is?</text><path d="M62 548.91 L388.72 548.91 C393.138 548.91 396.72 545.328 396.72 540.91 L396.72 460.974 C396.72 456.556 393.138 452.974 388.72 452.974 L62 452.974 C57.582 452.974 54 456.556 54 460.974 L54 540.91 C54 545.328 57.582 548.91 62 548.91 Z" fill="rgb(13,19,28)" stroke="rgb(36,48,63)" stroke-width="0.7"/><path d="M54 452.97399999999993h2.6v95.936h-2.6Z" fill="rgb(224,179,91)" stroke="none" stroke-width="0.7"/><text x="70" y="471.974" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">WHY THESE TWO TOGETHER</text><text x="70" y="489.974" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">Prerequisites and handoffs are the same failure seen from two angles: work</text><text x="70" y="503.958" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">that moves before it is ready, and work that moves without leaving a mark.</text><text x="70" y="517.942" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">Run them together and you learn both what was skipped and the exact place</text><text x="70" y="531.9259999999999" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">it was skipped.</text><path d="M306 168 L306 424.974" fill="none" stroke="rgb(36,48,63)" stroke-width="0.6"/><path d="M54 750 L558 750" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="54" y="763" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">THY-QYRIS-QC-001  ·  THY-QC1-0000-MASTER</text><text x="536.638" y="763" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">3 / 12</text></svg></div></div><div class="pg" data-page="4" style="width:612px;height:792px"><div style="transform:scale(1);transform-origin:0 0;width:612px;height:792px"><svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792"><path d="M0 0h612v792h-612Z" fill="rgb(10,14,20)" stroke="none" stroke-width="1"/><path d="M0 0h612v3h-612Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1"/><text x="54" y="30" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">QYRIS QUICKCHECK</text><text x="511.191" y="30" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">PLATE 02</text><path d="M54 38 L558 38" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="376" y="734" fill="rgb(24,34,47)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="190" font-weight="700" font-style="normal" xml:space="preserve">02</text><path d="M54.35 58.349999999999966h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M61.683 58.349999999999966h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M69.017 58.349999999999966h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/ le="normal" xml:space="preserve">Authority mismatch</text><text x="54" y="204" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11.2" font-weight="400" font-style="italic" xml:space="preserve">Who can do this, and who is allowed to decide</text><text x="54" y="220.79999999999995" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11.2" font-weight="400" font-style="italic" xml:space="preserve">it — and are those the same list by accident?</text><text x="54" y="242.08000000000004" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="1.8" xml:space="preserve">SOUNDS LIKE</text><text x="54" y="258.08000000000004" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="64" y="258.08000000000004" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">“They have access, so it’s fine.”</text><text x="54" y="271.144" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="64" y="271.144" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">“I just approved it myself.”</text><text x="54" y="284.208" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="64" y="284.208" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">“Whoever gets there first.”</text><text x="54" y="302.332" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="1.8" xml:space="preserve">THE ROUTE</text><text x="54" y="318.332" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">Separate access from authority in writing. Read is</text><text x="54" y="333.836" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">not write. Write is not approve. Approve is not pay.</text><text x="54" y="349.34" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">Where the system cannot hold the line, the line does</text><text x="54" y="364.844" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">not exist.</text><path d="M59 432.604 L286 432.604 C288.762 432.604 291 430.366 291 427.604 L291 378.714 C291 375.953 288.762 373.714 286 373.714 L59 373.714 C56.239 373.714 54 375.953 54 378.714 L54 427.604 C54 430.366 56.239 432.604 59 432.604 Z" fill="rgb(17,24,35)" stroke="none" stroke-width="1.6"/><path d="M54 373.714h2.6v58.89h-2.6Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1.6"/><text x="68" y="387.714" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.4" font-weight="700" font-style="normal" xml:space="preserve">Name one person with access who must not be</text><text x="68" y="401.344" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.4" font-weight="700" font-style="normal" xml:space="preserve">able to decide. If you cannot, the boundary is</text><text x="68" y="414.974" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.4" font-weight="700" font-style="normal" xml:space="preserve">not real yet.</text><path d="M324 182.17999999999995 L337 182.17999999999995 C338.657 182.17999999999995 340 180.837 340 179.17999999999995 L340 166.17999999999995 C340 164.52300000000002 338.657 163.17999999999995 337 163.17999999999995 L324 163.17999999999995 C322.343 163.17999999999995 321 164.52300000000002 321 166.17999999999995 L321 179.17999999999995 C321 180.837 322.343 182.17999999999995 324 182.17999999999995 Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1.6"/><text x="327.225" y="176.86" fill="rgb(10,14,20)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11.78" font-weight="700" font-style="normal" xml:space="preserve">4</text><text x="350" y="178" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="18.5" font-weight="700" font-style="normal" xml:space="preserve">Evidence gap</text><text x="321" y="204" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11.2" font-weight="400" font-style="italic" xml:space="preserve">What is being asserted here with nothing</text><text x="321" y="220.79999999999995" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11.2" font-weight="400" font-style="italic" xml:space="preserve">attached to it?</text><text x="321" y="242.08000000000004" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="1.8" xml:space="preserve">SOUNDS LIKE</text><text x="321" y="258.08000000000004" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="331" y="258.08000000000004" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">“It’s live.”</text><text x="321" y="271.144" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="331" y="271.144" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">“That’s been paid.”</text><text x="321" y="284.208" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="331" y="284.208" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">“We tested that.” — no date, no reference, no link.</text><text x="321" y="302.332" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="1.8" xml:space="preserve">THE ROUTE</text><text x="321" y="318.332" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">Attach the proof to the claim: a date, a reference</text><text x="321" y="333.836" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">number, a receipt, a screenshot, a passing test. A</text><text x="321" y="349.34" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">claim with no proof is marked OPEN, not TRUE —</text><text x="321" y="364.844" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">and a number nobody measured is named as</text><text x="321" y="380.348" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">unmeasured rather than estimated.</text><path d="M326 434.478 L553 434.478 C555.762 434.478 558 432.24 558 429.478 L558 394.218 C558 391.457 555.762 389.218 553 389.218 L326 389.218 C323.239 389.218 321 391.457 321 394.218 L321 429.478 C321 432.24 323.239 434.478 326 434.478 Z" fill="rgb(17,24,35)" stroke="none" stroke-width="1.6"/><path d="M321 389.218h2.6v45.26h-2.6Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1.6"/><text x="335" y="403.218" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.4" font-weight="700" font-style="normal" xml:space="preserve">For the three most important claims here, can</text><text x="335" y="416.848" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.4" font-weight="700" font-style="normal" xml:space="preserve">you produce the proof in under a minute?</text><path d="M62 550.4300000000001 L388.72 550.4300000000001 C393.138 550.4300000000001 396.72 546.848 396.72 542.4300000000001 L396.72 476.478 C396.72 472.06 393.138 468.478 388.72 468.478 L62 468.478 C57.582 468.478 54 472.06 54 476.478 L54 542.4300000000001 C54 546.848 57.582 550.4300000000001 62 550.4300000000001 Z" fill="rgb(13,19,28)" stroke="rgb(36,48,63)" stroke-width="0.7"/><path d="M54 468.47800000000007h2.6v81.952h-2.6Z" fill="rgb(224,179,91)" stroke="none" stroke-width="0.7"/><text x="70" y="487.478" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">WHY THESE TWO TOGETHER</text><text x="70" y="505.478" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">Authority and evidence are what an outsider checks first. Who was allowed</text><text x="70" y="519.462" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">to do this, and what proves it happened? Something that cannot answer both</text><text x="70" y="533.446" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">is not finished, however well it happens to be working today.</text><path d="M306 168 L306 440.478" fill="none" stroke="rgb(36,48,63)" stroke-width="0.6"/><path d="M54 750 L558 750" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="54" y="763" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">THY-QYRIS-QC-001  ·  THY-QC1-0000-MASTER</text><text x="536.638" y="763" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">4 / 12</text></svg></div></div><div class="pg" data-page="5" style="width:612px;height:792px"><div style="transform:scale(1);transform-origin:0 0;width:612px;height:792px"><svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792"><path d="M0 0h612v792h-612Z" fill="rgb(10,14,20)" stroke="none" stroke-width="1"/><path d="M0 0h612v3h-612Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1"/><text x="54" y="30" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">QYRIS QUICKCHECK</text><text x="511.191" y="30" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">PLATE 03</text><path d="M54 38 L558 38" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="376" y="734" fill="rg
