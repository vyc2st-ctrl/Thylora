, sans-serif' font-size="11.2" font-weight="400" font-style="italic" xml:space="preserve">What is already built, already paid for or</text><text x="321" y="220.79999999999995" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11.2" font-weight="400" font-style="italic" xml:space="preserve">already working that nobody is using or earning</text><text x="321" y="237.60000000000002" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11.2" font-weight="400" font-style="italic" xml:space="preserve">from?</text><text x="321" y="258.88" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="1.8" xml:space="preserve">SOUNDS LIKE</text><text x="321" y="274.88" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="331" y="274.88" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">“That’s just internal.”</text><text x="321" y="287.944" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="331" y="287.944" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">“We never finished packaging it.”</text><text x="321" y="301.008" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="331" y="301.008" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">“One price, take it or leave it.”</text><text x="321" y="319.132" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="1.8" xml:space="preserve">THE ROUTE</text><text x="321" y="335.132" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">List what already exists. For each, name one</text><text x="321" y="350.636" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">audience and one way it could pay for itself — or</text><text x="321" y="366.14" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">retire it deliberately. Where money reaches you</text><text x="321" y="381.644" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">through someone else’s click, disclose it in the same</text><text x="321" y="397.148" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">breath.</text><path d="M326 451.278 L553 451.278 C555.762 451.278 558 449.04 558 446.278 L558 411.018 C558 408.257 555.762 406.018 553 406.018 L326 406.018 C323.239 406.018 321 408.257 321 411.018 L321 446.278 C321 449.04 323.239 451.278 326 451.278 Z" fill="rgb(17,24,35)" stroke="none" stroke-width="1.6"/><path d="M321 406.01800000000003h2.6v45.26h-2.6Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1.6"/><text x="335" y="420.018" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.4" font-weight="700" font-style="normal" xml:space="preserve">Name the most valuable thing here that</text><text x="335" y="433.648" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.4" font-weight="700" font-style="normal" xml:space="preserve">currently has exactly one use.</text><path d="M62 581.2139999999999 L388.72 581.2139999999999 C393.138 581.2139999999999 396.72 577.6320000000001 396.72 573.2139999999999 L396.72 493.278 C396.72 488.86 393.138 485.278 388.72 485.278 L62 485.278 C57.582 485.278 54 488.86 54 493.278 L54 573.2139999999999 C54 577.6320000000001 57.582 581.2139999999999 62 581.2139999999999 Z" fill="rgb(13,19,28)" stroke="rgb(36,48,63)" stroke-width="0.7"/><path d="M54 485.2779999999999h2.6v95.936h-2.6Z" fill="rgb(224,179,91)" stroke="none" stroke-width="0.7"/><text x="70" y="504.278" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">WHY THESE TWO TOGETHER</text><text x="70" y="522.278" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">Rights and value pull against each other on purpose. Inspection 7 asks what</text><text x="70" y="536.262" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">you should not be doing with what you hold; inspection 8 asks what you</text><text x="70" y="550.246" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">should be doing with it and are not. Run them back to back or you will drift</text><text x="70" y="564.23" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">into one of them.</text><path d="M306 168 L306 457.278" fill="none" stroke="rgb(36,48,63)" stroke-width="0.6"/><path d="M54 750 L558 750" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="54" y="763" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">THY-QYRIS-QC-001  ·  THY-QC1-0000-MASTER</text><text x="536.638" y="763" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">6 / 12</text></svg></div></div><div class="pg" data-page="7" style="width:612px;height:792px"><div style="transform:scale(1);transform-origin:0 0;width:612px;height:792px"><svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792"><path d="M0 0h612v792h-612Z" fill="rgb(10,14,20)" stroke="none" stroke-width="1"/><path d="M0 0h612v3h-612Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1"/><text x="54" y="30" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">QYRIS QUICKCHECK</text><text x="511.191" y="30" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">PLATE 05</text><path d="M54 38 L558 38" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="376" y="734" fill="rgb(24,34,47)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="190" font-weight="700" font-style="normal" xml:space="preserve">05</text><path d="M54.35 58.349999999999966h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M61.683 58.349999999999966h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M69.017 58.349999999999966h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M54.35 65.68300000000005h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M61.333 65.33299999999996h6.087v6.087h-6.087Z" fill="rgb(224,179,91)" stroke="none" stroke-width="0.7"/><path d="M69.017 65.68300000000005h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M54.35 73.01600000000002h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M61.683 73.01600000000002h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M69.017 73.01600000000002h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><text x="88" y="74" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7" font-weight="700" font-style="normal" letter-spacing="2.2" xml:space="preserve">INSPECTION 9 AND DISPOSITION</text><text x="54" y="122" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="30" font-weight="700" font-style="normal" xml:space="preserve">Failure and recovery</text><path d="M54 138.82000000000005 L100 138.82000000000005" fill="none" stroke="rgb(224,179,91)" stroke-width="1.6"/><path d="M57 182.17999999999995 L70 182.17999999999995 C71.657 182.17999999999995 73 180.837 73 179.17999999999995 L73 166.17999999999995 C73 164.52300000000002 71.657 163.17999999999995 70 163.17999999999995 L57 163.17999999999995 C55.343 163.17999999999995 54 164.52300000000002 54 166.17999999999995 L54 179.17999999999995 C54 180.837 55.343 182.17999999999995 57 182.17999999999995 Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1.6"/><text x="60.225" y="176.86" fill="rgb(10,14,20)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11.78" font-weight="700" font-style="normal" xml:space="preserve">9</text><text x="83" y="178" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="18.5" font-weight="700" font-style="normal" xml:space="preserve">Failure and recovery</text><text x="54" y="204" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11.2" font-weight="400" font-style="italic" xml:space="preserve">When this breaks — not if — what happens,</text><text x="54" y="220.79999999999995" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11.2" font-weight="400" font-style="italic" xml:space="preserve">and what can be undone?</text><text x="54" y="242.08000000000004" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="1.8" xml:space="preserve">SOUNDS LIKE</text><text x="54" y="258.08000000000004" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="64" y="258.08000000000004" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">“It shouldn’t fail.”</text><text x="54" y="271.144" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="64" y="271.144" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">“We’d restore from backup.” — never tested.</text><text x="54" y="284.208" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="64" y="284.208" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">“We’d fix it manually.”</text><text x="54" y="302.332" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="1.8" xml:space="preserve">THE ROUTE</text><text x="54" y="318.332" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">Write the failure down and write the recovery beside</text><text x="54" y="333.836" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">it. A new version never overwrites the old one.</text><text x="54" y="349.34" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">Money that cannot be allocated is reported, never</text><text x="54" y="364.844" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">absorbed. Then perform the recovery once, on</text><text x="54" y="380.348" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">purpose, while nothing is on fire.</text><path d="M59 434.478 L286 434.478 C288.762 434.478 291 432.24 291 429.478 L291 394.218 C291 391.457 288.762 389.218 286 389.218 L59 389.218 C56.239 389.218 54 391.457 54 394.218 L54 429.478 C54 432.24 56.239 434.478 59 434.478 Z" fill="rgb(17,24,35)" stroke="none" stroke-width="1.6"/><path d="M54 389.218h2.6v45.26h-2.6Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1.6"/><text x="68" y="403.218" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.4" font-weight="700" font-style="normal" xml:space="preserve">When did you last actually perform the</text><text x="68" y="416.848" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.4" font-weight="700" font-style="normal" xml:space="preserve">recovery, rather than describe it?</text><path d="M306 168 L306 440.478" fill="none" stroke="rgb(36,48,63)" stroke-width="0.6"/><text x="321" y="176" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">DISPOSITION</text><text x="321" y="200" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="17" font-weight="700" font-style="normal" xml:space="preserve">Three words, and only three</text><path d="M327 226.5 L366.91 226.5 C370.223 226.5 372.91 223.81399999999996 372.91 220.5 L372.91 220 C372.91 216.68600000000004 370.223 214 366.91 214 L327 214 C323.686 214 321 216.68600000000004 321 220 L321 220.5 C321 223.81399999999996 323.686 226.5 327 226.5 Z" fill="none" stroke="rgb(47,107,70)" stroke-width="0.9"/><text x="329" y="222" fill="rgb(111,191,144)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.8" font-weight="700" font-style="normal" letter-spacing="1.2" xml:space="preserve">ROUTED</text><text x="321" y="238" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="normal" xml:space="preserve">Handled in this pass, or the route is written down with an</text><text x="321" y="251.20000000000005" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="normal" xml:space="preserve">owner and a date against it. Routed is not “we discussed it”.</text><path d="M327 275.05999999999995 L354.31 275.05999999999995 C357.623 275.05999999999995 360.31 272.374 360.31 269.05999999999995 L360.31 268.55999999999995 C360.31 265.246 357.623 262.55999999999995 354.31 262.55999999999995 L327 262.55999999999995 C323.686 262.55999999999995 321 265.246 321 268.55999999999995 L321 269.05999999999995 C321 272.374 323.686 275.05999999999995 327 275.05999999999995 Z" fill="none" stroke="rgb(107,90,47)" stroke-width="0.9"/><text x="329" y="270.55999999999995" fill="rgb(208,169,79)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.8" font-weight="700" font-style="normal" letter-spacing="1.2" xml:space="preserve">HELD</text><text x="321" y="286.56" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="normal" xml:space="preserve">Real, and it needs an authority you do not have. Name the</text><text x="321" y="299.76" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="normal" xml:space="preserve">authority, name what it waits on, and name what the waiting</text><text x="321" y="312.96" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="normal" xml:space="preserve">costs per week. Held is a legitimate answer. Held with no</text><text x="321" y="326.16" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="normal" xml:space="preserve">name attached is not.</text><path d="M327 350.02 L355.071 350.02 C358.385 350.02 361.071 347.334 361.071 344.02 L361.071 343.52 C361.071 340.206 358.385 337.52 355.071 337.52 L327 337.52 C323.686 337.52 321 340.206 321 343.52 L321 344.02 C321 347.334 323.686 350.02 327 350.02 Z" fill="none" stroke="rgb(107,50,50)" stroke-width="0.9"/><text x="329" y="345.52" fill="rgb(224,138,138)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.8" font-weight="700" font-style="normal" letter-spacing="1.2" xml:space="preserve">OPEN</text><text x="321" y="361.52" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="normal" xml:space="preserve">Found, no route yet. The dangerous one, because it looks</text><text x="321" y="374.72" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="normal" xml:space="preserve">like progress. Every OPEN gets a date before the pass</text><text x="321" y="387.92" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="normal" xml:space="preserve">closes, even if the date is only “decide by Friday”.</text><path d="M327 461.98 L552 461.98 C555.314 461.98 558 459.294 558 455.98 L558 409.28 C558 405.966 555.314 403.28 552 403.28 L327 403.28 C323.686 403.28 321 405.966 321 409.28 L321 455.98 C321 459.294 323.686 461.98 327 461.98 Z" fill="rgb(17,24,35)" stroke="none" stroke-width="0.9"/><path d="M321 403.28000000000003h2.6v58.7h-2.6Z" fill="rgb(224,179,91)" stroke="none" stroke-width="0.9"/><text x="335" y="418.28" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="700" font-style="normal" xml:space="preserve">No gap is reported and left unrouted where a safe,</text><text x="335" y="431.18" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="700" font-style="normal" xml:space="preserve">reversible route exists. If the route is safe and you</text><text x="335" y="444.08" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="700" font-style="normal" xml:space="preserve">can undo it, take it now and write ROUTED.</text><path d="M62 559.232 L388.72 559.232 C393.138 559.232 396.72 555.65 396.72 551.232 L396.72 485.28 C396.72 480.862 393.138 477.28 388.72 477.28 L62 477.28 C57.582 477.28 54 480.862 54 485.28 L54 551.232 C54 555.65 57.582 559.232 62 559.232 Z" fill="rgb(13,19,28)" stroke="rgb(36,48,63)" stroke-width="0.7"/><path d="M54 477.28h2.6v81.952h-2.6Z" fill="rgb(224,179,91)" stroke="none" stroke-width="0.7"/><text x="70" y="496.28" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">WHY THESE TWO TOGETHER</text><text x="70" y="514.28" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">Inspection 9 gets skipped because it describes a day that has not happened</text><text x="70" y="528.264" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">yet. Disposition is what stops the other eight becoming a list nobody acts on.</text><text x="70" y="542.248" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">Together they are the difference between a pass and a document.</text><path d="M54 750 L558 750" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="54" y="763" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">THY-QYRIS-QC-001  ·  THY-QC1-0000-MASTER</text><text x="536.638" y="763" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">7 / 12</text></svg></div></div><div class="pg" data-page="8" style="width:612px;height:792px"><div style="transform:scale(1);transform-origin:0 0;width:612px;height:792px"><svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792"><path d="M0 0h612v792h-612Z" fill="rgb(10,14,20)" stroke="none" stroke-width="1"/><path d="M0 0h612v3h-612Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1"/><text x="54" y="30" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">QYRIS QUICKCHECK</text><text x="511.191" y="30" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">PLATE 06</text><path d="M54 38 L558 38" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="376" y="734" fill="rgb(24,34,47)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="190" font-weight="700" font-style="normal" xml:space="preserve">06</text><path d="M54.35 58.349999999999966h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M61.683 58.349999999999966h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M69.017 58.349999999999966h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M54.35 65.68300000000005h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M61.333 65.33299999999996h6.087v6.087h-6.087Z" fill="rgb(224,179,91)" stroke="none" stroke-width="0.7"/><path d="M69.017 65.68300000000005h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M54.35 73.01600000000002h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M61.683 73.01600000000002h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M69.017 73.01600000000002h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><text x="88" y="74" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7" font-weight="700" font-style="normal" letter-spacing="2.2" xml:space="preserve">CLOSING THE PASS</text><text x="54" y="122" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="30" font-weight="700" font-style="normal" xml:space="preserve">Scoring and the readiness line</text><text x="54" y="148" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">A pass ends in one sentence you can say out loud without softening it.</text><path d="M54 160.24 L100 160.24" fill="none" stroke="rgb(224,179,91)" stroke-width="1.6"/><path d="M62 231.41999999999996 L550 231.41999999999996 C554.418 231.41999999999996 558 227.83799999999997 558 223.41999999999996 L558 193.41999999999996 C558 189.00199999999995 554.418 185.41999999999996 550 185.41999999999996 L62 185.41999999999996 C57.582 185.41999999999996 54 189.00199999999995 54 193.41999999999996 L54 223.41999999999996 C54 227.83799999999997 57.582 231.41999999999996 62 231.41999999999996 Z" fill="rgb(17,24,35)" stroke="rgb(138,100,21)" stroke-width="0.9"/><text x="70" y="202.41999999999996" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">READINESS LINE</text><text x="70" y="220.41999999999996" fill="rgb(224,179,91)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="15" font-weight="700" font-style="normal" xml:space="preserve">9 inspected · 7 routed · 2 held against a named authority · 0 open.</text><text x="54" y="259.41999999999996" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.4" font-weight="700" font-style="normal" xml:space="preserve">01</text><text x="81" y="259.41999999999996" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11" font-weight="700" font-style="normal" xml:space="preserve">Zero open is the bar to move</text><text x="81" y="275.41999999999996" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.6" font-weight="400" font-style="normal" xml:space="preserve">An OPEN item is a gap you have seen and not decided about.</text><text x="81" y="289.82" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.6" font-weight="400" font-style="normal" xml:space="preserve">Moving with one is a choice; make it deliberately and write it</text><text x="81" y="304.22" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.6" font-weight="400" font-style="normal" xml:space="preserve">down.</text><text x="54" y="326.3" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.4" font-weight="700" font-style="normal" xml:space="preserve">02</text><text x="81" y="326.3" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11" font-weight="700" font-style="normal" xml:space="preserve">Held may be non-zero, and must be named</text><text x="81" y="342.3" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.6" font-weight="400" font-style="normal" xml:space="preserve">Every HELD line names the authority, what it waits on, and</text><text x="81" y="356.7" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.6" font-weight="400" font-style="normal" xml:space="preserve">the weekly cost of waiting. Three HELD items with owners</text><text x="81" y="371.1" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.6" font-weight="400" font-style="normal" xml:space="preserve">beat one vague “in progress”.</text><text x="54" y="393.18" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.4" font-weight="700" font-style="normal" xml:space="preserve">03</text><text x="81" y="393.18" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11" font-weight="700" font-style="normal" xml:space="preserve">Nine routed and no evidence is not a pass</text><text x="81" y="409.18" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.6" font-weight="400" font-style="normal" xml:space="preserve">Spot-check two routes at random. Ask for the proof, not the</text><text x="81" y="423.58" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.6" font-weight="400" font-style="normal" xml:space="preserve">plan. If neither survives, run the pass again properly.</text><text x="54" y="445.66" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.4" font-weight="700" font-style="normal" xml:space="preserve">04</text><text x="81" y="445.66" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="11" font-weight="700" font-style="normal" xml:space="preserve">Do not re-score to look better</text><text x="81" y="461.66" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.6" font-weight="400" font-style="normal" xml:space="preserve">The count is a record, not a grade. A pass that flatters you has</text><text x="81" y="476.06" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.6" font-weight="400" font-style="normal" xml:space="preserve">cost you the only thing it was for.</text><path d="M372.32 488.972 L550 488.972 C554.418 488.972 558 485.39 558 480.972 L558 259.41999999999996 C558 255.00199999999995 554.418 251.41999999999996 550 251.41999999999996 L372.32 251.41999999999996 C367.902 251.41999999999996 364.32 255.00199999999995 364.32 259.41999999999996 L364.32 480.972 C364.32 485.39 367.902 488.972 372.32 488.972 Z" fill="rgb(13,19,28)" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="378.32" y="268.41999999999996" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.4" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">BLOCKER CARD · HELD OR OPEN</text><text x="378.32" y="284.42" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="388.32" y="284.42" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">ID and one-line name — so it can be</text><text x="388.32" y="297.888" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">carried forward verbatim.</text><text x="378.32" y="314.356" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="388.32" y="314.356" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">Severity — HARD (nothing proceeds),</text><text x="388.32" y="327.824" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">BY RULE (held deliberately),</text><text x="388.32" y="341.292" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">EVIDENCE GAP (unproven), or COST</text><text x="388.32" y="354.76" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">(needs spend).</text><text x="378.32" y="371.228" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="388.32" y="371.228" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">The consequence, carried honestly —</text><text x="388.32" y="384.696" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">what is untrue or unknown while this</text><text x="388.32" y="398.164" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">stands.</text><text x="378.32" y="414.632" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="388.32" y="414.632" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">What it needs — the specific authority,</text><text x="388.32" y="428.1" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">account, signature, person or</text><text x="388.32" y="441.568" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">measurement.</text><text x="378.32" y="458.036" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="388.32" y="458.036" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">Who can give it — a name, not a</text><text x="388.32" y="471.504" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">department.</text><path d="M54 750 L558 750" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="54" y="763" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">THY-QYRIS-QC-001  ·  THY-QC1-0000-MASTER</text><text x="536.638" y="763" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">8 / 12</text></svg></div></div><div class="pg" data-page="9" style="width:612px;height:792px"><div style="transform:scale(1);transform-origin:0 0;width:612px;height:792px"><svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792"><path d="M0 0h612v792h-612Z" fill="rgb(10,14,20)" stroke="none" stroke-width="1"/><path d="M0 0h612v3h-612Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1"/><text x="54" y="30" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">QYRIS QUICKCHECK</text><text x="511.191" y="30" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">PLATE 07</text><path d="M54 38 L558 38" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="376" y="734" fill="rgb(24,34,47)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="190" font-weight="700" font-style="normal" xml:space="preserve">07</text><path d="M54.35 58.349999999999966h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M61.683 58.349999999999966h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M69.017 58.349999999999966h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M54.35 65.68300000000005h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M61.333 65.33299999999996h6.087v6.087h-6.087Z" fill="rgb(224,179,91)" stroke="none" stroke-width="0.7"/><path d="M69.017 65.68300000000005h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M54.35 73.01600000000002h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M61.683 73.01600000000002h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M69.017 73.01600000000002h5.387v5.387h-5.387Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><text x="88" y="74" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7" font-weight="700" font-style="normal" letter-spacing="2.2" xml:space="preserve">QUALITY CONTROL</text><text x="54" y="122" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="30" font-weight="700" font-style="normal" xml:space="preserve">Five ways a pass goes weak</text><text x="54" y="148" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">Each of these looks like a completed pass from the outside. Each is worth nothing.</text><path d="M54 160.24 L100 160.24" fill="none" stroke="rgb(224,179,91)" stroke-width="1.6"/><text x="54" y="201.41999999999996" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="700" font-style="normal" xml:space="preserve">01</text><text x="80" y="201.41999999999996" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.6" font-weight="700" font-style="normal" xml:space="preserve">The nod-through</text><text x="174.789" y="201.41999999999996" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="italic" xml:space="preserve">Nine ticks in four minutes.</text><text x="80" y="216.41999999999996" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">Require one verbatim quote or one artefact per inspection. If you</text><text x="80" y="229.91999999999996" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">cannot quote or point, you did not inspect.</text><path d="M54 244.82000000000005 L366.48 244.82000000000005" fill="none" stroke="rgb(36,48,63)" stroke-width="0.5"/><text x="54" y="265.82000000000005" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="700" font-style="normal" xml:space="preserve">02</text><text x="80" y="265.82000000000005" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.6" font-weight="700" font-style="normal" xml:space="preserve">The blame pass</text><text x="169.532" y="265.82000000000005" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="italic" xml:space="preserve">Findings aimed at people.</text><text x="80" y="280.82" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">Route to a mechanism, never a name. The record is what failed, not</text><text x="80" y="294.32" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">who was near it. People read the sheet; make it safe to hand over.</text><path d="M54 309.22 L366.48 309.22" fill="none" stroke="rgb(36,48,63)" stroke-width="0.5"/><text x="54" y="330.22" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="700" font-style="normal" xml:space="preserve">03</text><text x="80" y="330.22" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.6" font-weight="700" font-style="normal" xml:space="preserve">The list with no owner</text><text x="201.321" y="330.22" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="italic" xml:space="preserve">Findings with nothing beside them.</text><text x="80" y="345.22" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">Every ROUTED carries an owner and a date. Every HELD carries an</text><text x="80" y="358.72" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">authority. Unowned findings decay into folklore.</text><path d="M54 373.62 L366.48 373.62" fill="none" stroke="rgb(36,48,63)" stroke-width="0.5"/><text x="54" y="394.62" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="700" font-style="normal" xml:space="preserve">04</text><text x="80" y="394.62" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.6" font-weight="700" font-style="normal" xml:space="preserve">The silent drop</text><text x="165.981" y="394.62" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="italic" xml:space="preserve">A finding that vanishes between passes.</text><text x="80" y="409.62" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">Carry every OPEN and HELD forward verbatim into the next sheet, with</text><text x="80" y="423.12" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">its age in days. Age is the most honest metric on the page.</text><path d="M54 438.02 L366.48 438.02" fill="none" stroke="rgb(36,48,63)" stroke-width="0.5"/><text x="54" y="459.02" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="700" font-style="normal" xml:space="preserve">05</text><text x="80" y="459.02" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.6" font-weight="700" font-style="normal" xml:space="preserve">The polish trap</text><text x="165.981" y="459.02" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="italic" xml:space="preserve">Fixing the readable things, leaving the unproven ones.</text><text x="80" y="474.02" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">When short of time, run inspections 4 and 9 first. Unproven claims and</text><text x="80" y="487.52" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">untested recovery are what reach customers.</text><path d="M54 502.42 L366.48 502.42" fill="none" stroke="rgb(36,48,63)" stroke-width="0.5"/><path d="M392.48 397.036 L550 397.036 C554.418 397.036 558 393.454 558 389.036 L558 197.41999999999996 C558 193.00199999999995 554.418 189.41999999999996 550 189.41999999999996 L392.48 189.41999999999996 C388.062 189.41999999999996 384.48 193.00199999999995 384.48 197.41999999999996 L384.48 389.036 C384.48 393.454 388.062 397.036 392.48 397.036 Z" fill="rgb(13,19,28)" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="398.48" y="206.41999999999996" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.8" font-weight="700" font-style="normal" letter-spacing="1.7" xml:space="preserve">RUNNING IT WITH OTHER PEOPLE</text><text x="398.48" y="222.41999999999996" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="408.48" y="222.41999999999996" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">One inspection at a time, out loud,</text><text x="408.48" y="235.88800000000003" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">going round the room. Twenty-five</text><text x="408.48" y="249.356" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">minutes.</text><text x="398.48" y="265.82399999999996" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="408.48" y="265.82399999999996" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">The person closest to the work</text><text x="408.48" y="279.29200000000003" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">speaks last, so the room’s first</text><text x="408.48" y="292.76" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">answer is not theirs.</text><text x="398.48" y="309.228" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="408.48" y="309.228" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">Write findings in the words that</text><text x="408.48" y="322.696" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">were actually said. Cleaned-up</text><text x="408.48" y="336.164" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">language hides the gap.</text><text x="398.48" y="352.632" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="408.48" y="352.632" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">Close on the readiness line, read</text><text x="408.48" y="366.1" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">aloud, by the person who owns the</text><text x="408.48" y="379.568" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.1" font-weight="400" font-style="normal" xml:space="preserve">thing.</text><path d="M54 750 L558 750" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="54" y="763" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">THY-QYRIS-QC-001  ·  THY-QC1-0000-MASTER</text><text x="536.638" y="763" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">9 / 12</text></svg></div></div><div class="pg" data-page="10" style="width:612px;height:792px"><div style="transform:scale(1);transform-origin:0 0;width:612px;height:792px"><svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792"><path d="M0 0h612v792h-612Z" fill="rgb(244,239,230)" stroke="none" stroke-width="1"/><path d="M0 0h612v3h-612Z" fill="rgb(138,100,21)" stroke="none" stroke-width="1"/><text x="54" y="30" fill="rgb(95,106,120)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">QYRIS QUICKCHECK</text><text x="466.198" y="30" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">WORKED EXAMPLE</text><path d="M54 38 L558 38" fill="none" stroke="rgb(202,187,159)" stroke-width="0.7"/><path d="M54.35 58.349999999999966h5.387v5.387h-5.387Z" fill="none" stroke="rgb(111,75,35)" stroke-width="0.7"/><path d="M61.683 58.349999999999966h5.387v5.387h-5.387Z" fill="none" stroke="rgb(111,75,35)" stroke-width="0.7"/><path d="M69.017 58.349999999999966h5.387v5.387h-5.387Z" fill="none" stroke="rgb(111,75,35)" stroke-width="0.7"/><path d="M54.35 65.68300000000005h5.387v5.387h-5.387Z" fill="none" stroke="rgb(111,75,35)" stroke-width="0.7"/><path d="M61.333 65.33299999999996h6.087v6.087h-6.087Z" fill="rgb(138,100,21)" stroke="none" stroke-width="0.7"/><path d="M69.017 65.68300000000005h5.387v5.387h-5.387Z" fill="none" stroke="rgb(111,75,35)" stroke-width="0.7"/><path d="M54.35 73.01600000000002h5.387v5.387h-5.387Z" fill="none" stroke="rgb(111,75,35)" stroke-width="0.7"/><path d="M61.683 73.01600000000002h5.387v5.387h-5.387Z" fill="none" stroke="rgb(111,75,35)" stroke-width="0.7"/><path d="M69.017 73.01600000000002h5.387v5.387h-5.387Z" fill="none" stroke="rgb(111,75,35)" stroke-width="0.7"/><text x="88" y="74" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7" font-weight="700" font-style="normal" letter-spacing="2.2" xml:space="preserve">WORKED EXAMPLE</text><text x="54" y="122" fill="rgb(15,22,32)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="30" font-weight="700" font-style="normal" xml:space="preserve">A first digital product, going live on Friday</text><text x="54" y="148" fill="rgb(44,54,68)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">One person, one store, one $29 downloadable guide. Fourteen minutes, on a Tuesday.</text><text x="54" y="163.80999999999995" fill="rgb(44,54,68)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="400" font-style="normal" xml:space="preserve">Findings are written here as they were written on the day.</text><path d="M54 176.04999999999995 L100 176.04999999999995" fill="none" stroke="rgb(138,100,21)" stroke-width="1.6"/><text x="70" y="199.23000000000002" fill="rgb(95,106,120)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.8" font-weight="700" font-style="normal" letter-spacing="1.4" xml:space="preserve">INSPECTION</text><text x="170" y="199.23000000000002" fill="rgb(95,106,120)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.8" font-weight="700" font-style="normal" letter-spacing="1.4" xml:space="preserve">WHAT THE PASS FOUND</text><text x="338" y="199.23000000000002" fill="rgb(95,106,120)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.8" font-weight="700" font-style="normal" letter-spacing="1.4" xml:space="preserve">DISPOSITION</text><text x="400" y="199.23000000000002" fill="rgb(95,106,120)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.8" font-weight="700" font-style="normal" letter-spacing="1.4" xml:space="preserve">ROUTE, OWNER, DATE</text><path d="M54 205.23000000000002 L558 205.23000000000002" fill="none" stroke="rgb(138,100,21)" stroke-width="1.1"/><path d="M48 209.23000000000005h516v42.6h-516Z" fill="rgb(239,232,218)" stroke="none" stroke-width="1.1"/><text x="54" y="218.23000000000002" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7.6" font-weight="700" font-style="normal" xml:space="preserve">1</text><text x="70" y="218.23000000000002" fill="rgb(15,22,32)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7.6" font-weight="700" font-style="normal" xml:space="preserve">Missing prerequisite</text><text x="170" y="218.23000000000002" fill="rgb(44,54,68)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7.4" font-weight="400" font-style="normal" xml:space="preserve">Nothing checks that the file a customer</text><text x="170" y="228.42999999999995" fill="rgb(44,54,68)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7.4" font-weight="400" font-style="normal" xml:space="preserve">downloads is the final build. The link points at</text><text x="170" y="238.63" fill="rgb(44,54,68)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7.4" font-weight="400" font-style="normal" xml:space="preserve">whatever is in the folder.</text><path d="M344 222.73000000000002 L378 222.73000000000002 C381.314 222.73000000000002 384 220.04399999999998 384 216.73000000000002 L384 216.73000000000002 C384 213.41600000000005 381.314 210.73000000000002 378 210.73000000000002 L344 210.73000000000002 C340.686 210.73000000000002 338 213.41600000000005 338 216.73000000000002 L338 216.73000000000002 C338 220.04399999999998 340.686 222.73000000000002 344 222.73000000000002 Z" fill="none" stroke="rgb(44,107,71)" stroke-width="0.8"/><text x="344.79" y="218.23000000000002" fill="rgb(44,107,71)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.4" font-weight="700" font-style="normal" letter-spacing="0.9" xml:space="preserve">ROUTED</text><text x="400" y="218.23000000000002" fill="rgb(44,54,68)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7.4" font-weight="400" font-style="normal" xml:space="preserve">Delivery reads a named build with a</text><text x="400" y="228.42999999999995" fill="rgb(44,54,68)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7.4" font-weight="400" font-style="normal" xml:space="preserve">checksum; a mismatch refuses to deliver. Me ·</text><text x="400" y="238.63" fill="rgb(44,54,68)" font-family='"Liberation Sans", Arial, sans ying the same serial with a new edition line.</text><text x="54" y="574.16" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.4" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">WHAT THIS IS NOT</text><text x="54" y="588.16" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="400" font-style="normal" xml:space="preserve">This is a thinking instrument. It is not legal, financial, medical, tax or safety advice, and it does not replace a regulated review where</text><text x="54" y="601.232" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="400" font-style="normal" xml:space="preserve">one is required.</text><text x="54" y="614.304" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="400" font-style="normal" xml:space="preserve">It finds gaps. It does not close them. Every route on the sheet needs a person and a date or it is decoration.</text><text x="54" y="627.376" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="400" font-style="normal" xml:space="preserve">A pass is a record of what you saw on one day. Keep the old sheets: the drift between them is worth more than any single pass.</text><path d="M54 750 L558 750" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="54" y="763" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">THY-QYRIS-QC-001  ·  THY-QC1-0000-MASTER</text><text x="532.258" y="763" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">12 / 12</text></svg></div></div>
