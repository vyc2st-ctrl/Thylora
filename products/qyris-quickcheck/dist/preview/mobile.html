  </style><div class="pg" data-page="1" style="width:360px;height:640px"><div style="transform:scale(1);transform-origin:0 0;width:360px;height:640px"><svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640"><path d="M0 0h360v640h-360Z" fill="rgb(10,14,20)" stroke="none" stroke-width="1"/><path d="M0 0h360v294.4h-360Z" fill="rgb(12,18,27)" stroke="none" stroke-width="1"/><path d="M0 0h360v5h-360Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1"/><text x="26" y="40" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="700" font-style="normal" letter-spacing="3.2" xml:space="preserve">THYLORA</text><text x="246.647" y="40" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7" font-weight="700" font-style="normal" letter-spacing="1.4" xml:space="preserve">THY-QYRIS-QC-001</text><path d="M26 52 L334 52" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><path d="M26.35 78.35000000000005h7.6v7.6h-7.6Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M36.35 78.35000000000005h7.6v7.6h-7.6Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M46.35 78.35000000000005h7.6v7.6h-7.6Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M26.35 88.35000000000005h7.6v7.6h-7.6Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M36 87.99999999999996h8.3v8.3h-8.3Z" fill="rgb(224,179,91)" stroke="none" stroke-width="0.7"/><path d="M46.35 88.35000000000005h7.6v7.6h-7.6Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M26.35 98.35000000000005h7.6v7.6h-7.6Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M36.35 98.35000000000005h7.6v7.6h-7.6Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M46.35 98.35000000000005h7.6v7.6h-7.6Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><text x="26" y="168" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7.4" font-weight="700" font-style="normal" letter-spacing="2.2" xml:space="preserve">THYLORA STANDARDS SERIES · 01</text><text x="26" y="212" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="40" font-weight="700" font-style="normal" xml:space="preserve">QYRIS</text><text x="26" y="248.8" fill="rgb(224,179,91)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="40" font-weight="700" font-style="normal" xml:space="preserve">QuickCheck</text><path d="M26 270.8 L90 270.8" fill="none" stroke="rgb(224,179,91)" stroke-width="2"/><text x="26" y="289.8" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7.4" font-weight="700" font-style="normal" letter-spacing="3" xml:space="preserve">THE NINE-INSPECTION PASS</text><text x="26" y="313.8" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="13" font-weight="400" font-style="normal" xml:space="preserve">Twelve minutes. Nine questions. One page you can hand</text><text x="26" y="331.22" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="13" font-weight="400" font-style="normal" xml:space="preserve">to anyone.</text><text x="26" y="355.92" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">A review asks whether something is good. A QuickCheck asks whether</text><text x="26" y="369.6" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">anything is missing, unowned, unproven or unrecoverable — and then routes</text><text x="26" y="383.28" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">it.</text><path d="M36 600.88 L324 600.88 C329.523 600.88 334 596.403 334 590.88 L334 414.88 C334 409.35699999999997 329.523 404.88 324 404.88 L36 404.88 C30.477 404.88 26 409.35699999999997 26 414.88 L26 590.88 C26 596.403 30.477 600.88 36 600.88 Z" fill="rgb(17,24,35)" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="40" y="422.88" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.8" font-weight="700" font-style="normal" letter-spacing="2.2" xml:space="preserve">INSIDE</text><text x="40" y="438.88" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7.4" font-weight="700" font-style="normal" xml:space="preserve">00</text><text x="60" y="438.88" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8" font-weight="400" font-style="normal" xml:space="preserve">How to run the pass</text><text x="40" y="454.88" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7.4" font-weight="700" font-style="normal" xml:space="preserve">01</text><text x="60" y="454.88" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8" font-weight="400" font-style="normal" xml:space="preserve">Missing prerequisite · Hidden handoff</text><text x="40" y="470.88" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7.4" font-weight="700" font-style="normal" xml:space="preserve">02</text><text x="60" y="470.88" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8" font-weight="400" font-style="normal" xml:space="preserve">Authority mismatch · Evidence gap</text><text x="40" y="486.88" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7.4" font-weight="700" font-style="normal" xml:space="preserve">03</text><text x="60" y="486.88" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8" font-weight="400" font-style="normal" xml:space="preserve">Unnecessary waiting · Customer friction</text><text x="40" y="502.88" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7.4" font-weight="700" font-style="normal" xml:space="preserve">04</text><text x="60" y="502.88" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8" font-weight="400" font-style="normal" xml:space="preserve">Rights and privacy risk · Value left on the table</text><text x="40" y="518.88" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7.4" font-weight="700" font-style="normal" xml:space="preserve">05</text><text x="60" y="518.88" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8" font-weight="400" font-style="normal" xml:space="preserve">Failure and recovery · Disposition</text><text x="40" y="534.88" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7.4" font-weight="700" font-style="normal" xml:space="preserve">06</text><text x="60" y="534.88" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8" font-weight="400" font-style="normal" xml:space="preserve">Scoring and the readiness line</text><text x="40" y="550.88" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7.4" font-weight="700" font-style="normal" xml:space="preserve">07</text><text x="60" y="550.88" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8" font-weight="400" font-style="normal" xml:space="preserve">Five ways a pass goes weak</text><text x="40" y="566.88" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7.4" font-weight="700" font-style="normal" xml:space="preserve">—</text><text x="60" y="566.88" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8" font-weight="400" font-style="normal" xml:space="preserve">Worked example · a launch, filled in</text><text x="40" y="582.88" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7.4" font-weight="700" font-style="normal" xml:space="preserve">—</text><text x="60" y="582.88" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8" font-weight="400" font-style="normal" xml:space="preserve">The QuickCheck Sheet · fillable, reusable</text><path d="M0 580h360v60h-360Z" fill="rgb(8,12,18)" stroke="none" stroke-width="0.7"/><path d="M0 580 L360 580" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="26" y="602" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.4" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">SERIAL</text><text x="26" y="618" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.5" font-weight="700" font-style="normal" letter-spacing="0.6" xml:space="preserve">THY-QC1-0000-MASTER</text><text x="229.27" y="602" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.4" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">FIRST EDITION · V1.0</text><text x="250.562" y="618" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.5" font-weight="400" font-style="normal" xml:space="preserve">22 September 2026</text></svg></div></div><div class="pg" data-page="2" style="width:360px;height:640px"><div style="transform:scale(1);transform-origin:0 0;width:360px;height:640px"><svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640"><path d="M0 0h360v640h-360Z" fill="rgb(10,14,20)" stroke="none" stroke-width="1"/><path d="M0 0h360v3h-360Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1"/><text x="26" y="30" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">QYRIS QUICKCHECK</text><text x="287.191" y="30" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">PLATE 00</text><path d="M26 38 L334 38" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="220" y="598" fill="rgb(24,34,47)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="120" font-weight="700" font-style="normal" xml:space="preserve">00</text><path d="M26.35 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.683 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M37.017 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M26.35 53.68299999999997h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.333 53.33299999999999h4.427v4.427h-4.427Z" fill="rgb(224,179,91)" stroke="none" stroke-width="0.7"/><path d="M37.017 53.68299999999997h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M26.35 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.683 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M37.017 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><text x="54" y="60" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7" font-weight="700" font-style="normal" letter-spacing="2.2" xml:space="preserve">BEFORE YOU START</text><text x="26" y="96" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="21" font-weight="700" font-style="normal" xml:space="preserve">How to run the pass</text><text x="26" y="116" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">Nine inspections, roughly a minute each, then one readiness line. Twelve</text><text x="26" y="130.26" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">minutes on your own. Twenty-five with a room. Run it at the start of a thing,</text><text x="26" y="144.51999999999998" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">again the week before it ships, and again the week after it is live — and</text><text x="26" y="158.77999999999997" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">keep all three sheets.</text><path d="M26 169.82 L72 169.82" fill="none" stroke="rgb(224,179,91)" stroke-width="1.6"/><text x="26" y="192.10000000000002" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="700" font-style="normal" xml:space="preserve">01</text><text x="49" y="192.10000000000002" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="700" font-style="normal" xml:space="preserve">One pass, everything at once</text><text x="49" y="206.10000000000002" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">Report every gap you find in a single pass. Handing someone one</text><text x="49" y="219.89999999999998" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">problem at a time costs them a round trip per problem, and it teaches</text><text x="49" y="233.7" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">them to dread the next one.</text><text x="26" y="251.18" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="700" font-style="normal" xml:space="preserve">02</text><text x="49" y="251.18" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="700" font-style="normal" xml:space="preserve">Name the route, not just the gap</text><text x="49" y="265.18" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">A gap with no route is not a finding, it is a complaint. Every line gets a</text><text x="49" y="278.98" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">next action with an owner and a date, or a named authority it waits</text><text x="49" y="292.78" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">on.</text><text x="26" y="310.26" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="700" font-style="normal" xml:space="preserve">03</text><text x="49" y="310.26" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="700" font-style="normal" xml:space="preserve">Held is honest. Silent is not</text><text x="49" y="324.26" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">If closing a gap needs an authority you do not have — money, a</text><text x="49" y="338.06" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">signature, an account, another person — write HELD and name what</text><text x="49" y="351.86" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">it waits on. Never quietly drop it.</text><text x="26" y="369.34" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="700" font-style="normal" xml:space="preserve">04</text><text x="49" y="369.34" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="700" font-style="normal" xml:space="preserve">Evidence outranks assertion</text><text x="49" y="383.34" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">“Done” is a claim. A date, a reference, a receipt, a passing test is</text><text x="49" y="397.14" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">proof. Where there is no proof, the disposition is OPEN, however</text><text x="49" y="410.94" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">confident the room sounds.</text><path d="M26 610 L334 610" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="26" y="623" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">THY-QYRIS-QC-001  ·  THY-QC1-0000-MASTER</text><text x="312.638" y="623" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">2 / 23</text></svg></div></div><div class="pg" data-page="3" style="width:360px;height:640px"><div style="transform:scale(1);transform-origin:0 0;width:360px;height:640px"><svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640"><path d="M0 0h360v640h-360Z" fill="rgb(10,14,20)" stroke="none" stroke-width="1"/><path d="M0 0h360v3h-360Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1"/><text x="26" y="30" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">QYRIS QUICKCHECK</text><text x="287.191" y="30" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">PLATE 00</text><path d="M26 38 L334 38" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="220" y="598" fill="rgb(24,34,47)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="120" font-weight="700" font-style="normal" xml:space="preserve">00</text><path d="M26.35 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.683 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M37.017 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M26.35 53.68299999999997h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.333 53.33299999999999h4.427v4.427h-4.427Z" fill="rgb(224,179,91)" stroke="none" stroke-width="0.7"/><path d="M37.017 53.68299999999997h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M26.35 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.683 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M37.017 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><text x="54" y="60" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7" font-weight="700" font-style="normal" letter-spacing="2.2" xml:space="preserve">BEFORE YOU START</text><text x="26" y="96" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="21" font-weight="700" font-style="normal" xml:space="preserve">When to run it</text><path d="M26 107.72000000000003 L72 107.72000000000003" fill="none" stroke="rgb(224,179,91)" stroke-width="1.6"/><path d="M34 227.27999999999997 L326 227.27999999999997 C330.418 227.27999999999997 334 223.69799999999998 334 219.27999999999997 L334 136 C334 131.582 330.418 128 326 128 L34 128 C29.582 128 26 131.582 26 136 L26 219.27999999999997 C26 223.69799999999998 29.582 227.27999999999997 34 227.27999999999997 Z" fill="rgb(13,19,28)" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="40" y="145" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.4" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">WHEN TO RUN IT</text><text x="40" y="161" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="50" y="161" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">Before you ship, sign, pay or promise a date.</text><text x="40" y="177.32" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="50" y="177.32" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">When something has been “nearly ready” for the third week running.</text><text x="40" y="193.64" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="50" y="193.64" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">After anything reached a customer that should not have.</text><text x="40" y="209.95999999999998" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="50" y="209.95999999999998" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">Before you tell anyone outside that a thing is live.</text><path d="M34 309.08 L326 309.08 C330.418 309.08 334 305.498 334 301.08 L334 249.27999999999997 C334 244.86200000000002 330.418 241.27999999999997 326 241.27999999999997 L34 241.27999999999997 C29.582 241.27999999999997 26 244.86200000000002 26 249.27999999999997 L26 301.08 C26 305.498 29.582 309.08 34 309.08 Z" fill="rgb(17,24,35)" stroke="rgb(138,100,21)" stroke-width="0.8"/><text x="40" y="259.28" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.4" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">IF YOU ONLY HAVE FOUR MINUTES</text><text x="40" y="277.28" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="400" font-style="normal" xml:space="preserve">Run inspection 4 and inspection 9. Unproven claims and untested</text><text x="40" y="290.18" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="400" font-style="normal" xml:space="preserve">recovery are what actually reach customers.</text><path d="M26 610 L334 610" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="26" y="623" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">THY-QYRIS-QC-001  ·  THY-QC1-0000-MASTER</text><text x="312.638" y="623" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">3 / 23</text></svg></div></div><div class="pg" data-page="4" style="width:360px;height:640px"><div style="transform:scale(1);transform-origin:0 0;width:360px;height:640px"><svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640"><path d="M0 0h360v640h-360Z" fill="rgb(10,14,20)" stroke="none" stroke-width="1"/><path d="M0 0h360v3h-360Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1"/><text x="26" y="30" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">QYRIS QUICKCHECK</text><text x="287.191" y="30" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">PLATE 01</text><path d="M26 38 L334 38" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="220" y="598" fill="rgb(24,34,47)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="120" font-weight="700" font-style="normal" xml:space="preserve">01</text><path d="M26.35 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.683 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M37.017 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M26.35 53.68299999999997h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.333 53.33299999999999h4.427v4.427h-4.427Z" fill="rgb(224,179,91)" stroke="none" stroke-width="0.7"/><path d="M37.017 53.68299999999997h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M26.35 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.683 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M37.017 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><text x="54" y="60" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7" font-weight="700" font-style="normal" letter-spacing="2.2" xml:space="preserve">INSPECTION 1 OF 9</text><text x="26" y="96" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="21" font-weight="700" font-style="normal" xml:space="preserve">Missing prerequisite</text><path d="M26 107.72000000000003 L72 107.72000000000003" fill="none" stroke="rgb(224,179,91)" stroke-width="1.6"/><text x="26" y="128" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.4" font-weight="400" font-style="italic" xml:space="preserve">What must already be true for this to work — and is any of it</text><text x="26" y="143.60000000000002" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.4" font-weight="400" font-style="italic" xml:space="preserve">merely assumed?</text><text x="26" y="163.36" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="1.8" xml:space="preserve">SOUNDS LIKE</text><text x="26" y="177.36" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="36" y="177.36" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="normal" xml:space="preserve">“We’ll sort that out at the end.”</text><text x="26" y="189.856" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="36" y="189.856" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="normal" xml:space="preserve">“It usually just works.”</text><text x="26" y="202.35199999999998" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="36" y="202.35199999999998" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="normal" xml:space="preserve">“Someone must have done that by now.”</text><text x="26" y="219.688" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="1.8" xml:space="preserve">THE ROUTE</text><text x="26" y="233.688" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.8" font-weight="400" font-style="normal" xml:space="preserve">List every precondition in one place. For each, name the thing that</text><text x="26" y="248.584" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.8" font-weight="400" font-style="normal" xml:space="preserve">checks it. Where nothing checks it, that check is the work — and it</text><text x="26" y="263.48" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.8" font-weight="400" font-style="normal" xml:space="preserve">belongs before the step it protects, not after.</text><path d="M31 316.29 L329 316.29 C331.762 316.29 334 314.052 334 311.29 L334 276.61 C334 273.848 331.762 271.61 329 271.61 L31 271.61 C28.239 271.61 26 273.848 26 276.61 L26 311.29 C26 314.052 28.239 316.29 31 316.29 Z" fill="rgb(17,24,35)" stroke="none" stroke-width="1.6"/><path d="M26 271.61h2.6v44.68h-2.6Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1.6"/><text x="40" y="285.61" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">Can you point at the thing that refuses to proceed when the</text><text x="40" y="298.95" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">precondition is missing?</text><path d="M26 610 L334 610" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="26" y="623" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">THY-QYRIS-QC-001  ·  THY-QC1-0000-MASTER</text><text x="312.638" y="623" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">4 / 23</text></svg></div></div><div class="pg" data-page="5" style="width:360px;height:640px"><div style="transform:scale(1);transform-origin:0 0;width:360px;height:640px"><svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640"><path d="M0 0h360v640h-360Z" fill="rgb(10,14,20)" stroke="none" stroke-width="1"/><path d="M0 0h360v3h-360Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1"/><text x="26" y="30" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">QYRIS QUICKCHECK</text><text x="287.191" y="30" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">PLATE 02</text><path d= ><text x="26" y="143.60000000000002" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.4" font-weight="400" font-style="italic" xml:space="preserve">record of the pass?</text><text x="26" y="163.36" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="1.8" xml:space="preserve">SOUNDS LIKE</text><text x="26" y="177.36" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="36" y="177.36" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="normal" xml:space="preserve">“I sent it over.”</text><text x="26" y="189.856" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="36" y="189.856" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="normal" xml:space="preserve">“It’s with them now.”</text><text x="26" y="202.35199999999998" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="36" y="202.35199999999998" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="normal" xml:space="preserve">“I thought you had it.”</text><text x="26" y="219.688" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="1.8" xml:space="preserve">THE ROUTE</text><text x="26" y="233.688" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.8" font-weight="400" font-style="normal" xml:space="preserve">Give every handoff a record written by the system, not by memory:</text><text x="26" y="248.584" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.8" font-weight="400" font-style="normal" xml:space="preserve">who moved it, when, out of what state and into what state. A trail</text><text x="26" y="263.48" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.8" font-weight="400" font-style="normal" xml:space="preserve">nobody has to be present to reconstruct.</text><path d="M31 316.29 L329 316.29 C331.762 316.29 334 314.052 334 311.29 L334 276.61 C334 273.848 331.762 271.61 329 271.61 L31 271.61 C28.239 271.61 26 273.848 26 276.61 L26 311.29 C26 314.052 28.239 316.29 31 316.29 Z" fill="rgb(17,24,35)" stroke="none" stroke-width="1.6"/><path d="M26 271.61h2.6v44.68h-2.6Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1.6"/><text x="40" y="285.61" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">If everyone involved were unreachable tomorrow, could a</text><text x="40" y="298.95" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">stranger say where this is?</text><path d="M26 610 L334 610" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="26" y="623" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">THY-QYRIS-QC-001  ·  THY-QC1-0000-MASTER</text><text x="312.638" y="623" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">5 / 23</text></svg></div></div><div class="pg" data-page="6" style="width:360px;height:640px"><div style="transform:scale(1);transform-origin:0 0 '"Liberation Sans", Arial, sans-serif' font-size="7" font-weight="700" font-style="normal" letter-spacing="2.2" xml:space="preserve">INSPECTION 3 OF 9</text><text x="26" y="96" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="21" font-weight="700" font-style="normal" xml:space="preserve">Authority mismatch</text><path d="M26 107.72000000000003 L72 107.72000000000003" fill="none" stroke="rgb(224,179,91)" stroke-width="1.6"/><text x="26" y="128" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.4" font-weight="400" font-style="italic" xml:space="preserve">Who can do this, and who is allowed to decide it — and are those</text><text x="26" y="143.60000000000002" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.4" font-weight="400" font-style="italic" xml:space="preserve">the same list by accident?</text><text x="26" y="163.36" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="1.8" xml:space="preserve">SOUNDS LIKE</text><text x="26" y="177.36" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="36" y="177.36" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="normal" xml:space="preserve">“They have access, so it’s fine.”</text><text x="26" y="189.856" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="36" y="189.856" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="normal" xml:space="preserve">“I just approved it myself.”</text><text x="26" y="202.35199999999998" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="36" y="202.35199999999998" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="normal" xml:space="preserve">“Whoever gets there first.”</text><text x="26" y="219.688" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="1.8" xml:space="preserve">THE ROUTE</text><text x="26" y="233.688" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.8" font-weight="400" font-style="normal" xml:space="preserve">Separate access from authority in writing. Read is not write. Write is</text><text x="26" y="248.584" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.8" font-weight="400" font-style="normal" xml:space="preserve">not approve. Approve is not pay. Where the system cannot hold the</text><text x="26" y="263.48" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.8" font-weight="400" font-style="normal" xml:space="preserve">line, the line does not exist.</text><path d="M31 316.29 L329 316.29 C331.762 316.29 334 314.052 334 311.29 L334 276.61 C334 273.848 331.762 271.61 329 271.61 L31 271.61 C28.239 271.61 26 273.848 26 276.61 L26 311.29 C26 314.052 28.239 316.29 31 316.29 Z" fill="rgb(17,24,35)" stroke="none" stroke-width="1.6"/><path d="M26 271.61h2.6v44.68h-2.6Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1.6"/><text x="40" y="285.61" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">Name one person with access who must not be able to decide. If</text><text x="40" y="298.95" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">you cannot, the boundary is not real yet.</text><path d="M26 610 L334 610" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="26" y="623" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">THY-QYRIS-QC-001  ·  THY-QC1-0000-MASTER</text><text x="312.638" y="623" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">6 / 23</text></svg></div></div><div class="pg" data-page="7" style="width:360px;height:640px"><div style="transform:scale(1);transform-origin:0 0;width:360px;height:640px"><svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640"><path d="M0 0h360v640h-360Z" fill="rgb(10,14,20)" stroke="none" stroke-width="1"/><path d="M0 0h360v3h-360Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1"/><text x="26" y="30" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">QYRIS QUICKCHECK</text><text x="287.191" y="30" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">PLATE 04</text><path d="M26 38 L334 38" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="220" y="598" fill="rgb(24,34,47)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="120" font-weight="700" font-style="normal" xml:space="preserve">04</text><path d="M26.35 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.683 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M37.017 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M26.35 53.68299999999997h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.333 53.33299999999999h4.427v4.427h-4.427Z" fill="rgb(224,179,91)" stroke="none" stroke-width="0.7"/><path d="M37.017 53.68299999999997h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M26.35 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.683 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M37.017 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><text x="54" y="60" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7" font-weight="700" font-style="normal" letter-spacing="2.2" xml:space="preserve">INSPECTION 4 OF 9</text><text x="26" y="96" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="21" font-weight="700" font-style="normal" xml:space="preserve">Evidence gap</text><path d="M26 107.72000000000003 L72 107.72000000000003" fill="none" stroke="rgb(224,179,91)" stroke-width="1.6"/><text x="26" y="128" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.4" font-weight="400" font-style="italic" xml:space="preserve">What is being asserted here with nothing attached to it?</text><text x="26" y="147.76" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="1.8" xml:space="preserve">SOUNDS LIKE</text><text x="26" y="161.76" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="36" y="161.76" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style= ="normal" xml:space="preserve">rather than estimated.</text><path d="M31 315.586 L329 315.586 C331.762 315.586 334 313.348 334 310.586 L334 275.906 C334 273.145 331.762 270.906 329 270.906 L31 270.906 C28.239 270.906 26 273.145 26 275.906 L26 310.586 C26 313.348 28.239 315.586 31 315.586 Z" fill="rgb(17,24,35)" stroke="none" stroke-width="1.6"/><path d="M26 270.906h2.6v44.68h-2.6Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1.6"/><text x="40" y="284.906" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">For the three most important claims here, can you produce the</text><text x="40" y="298.246" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">proof in under a minute?</text><path d="M26 610 L334 610" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="26" y="623" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">THY-QYRIS-QC-001  ·  THY-QC1-0000-MASTER</text><text x="312.638" y="623" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">7 / 23</text></svg></div></div><div class="pg" data-page="8" style="width:360px;height:640px"><div style="transform:scale(1);transform-origin:0 0;width:360px;height:640px"><svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640"><path d="M0 0h360v640h-360Z" fill="rgb(10,14,20)" stroke="none" stroke-width="1"/><path d="M0 0h360v3h-360Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1"/><text x="26" y="30" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" x
