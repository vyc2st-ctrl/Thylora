" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M26.35 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.683 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M37.017 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><text x="54" y="60" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7" font-weight="700" font-style="normal" letter-spacing="2.2" xml:space="preserve">INSPECTION 9 OF 9</text><text x="26" y="96" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="21" font-weight="700" font-style="normal" xml:space="preserve">Failure and recovery</text><path d="M26 107.72000000000003 L72 107.72000000000003" fill="none" stroke="rgb(224,179,91)" stroke-width="1.6"/><text x="26" y="128" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.4" font-weight="400" font-style="italic" xml:space="preserve">When this breaks — not if — what happens, and what can be</text><text x="26" y="143.60000000000002" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.4" font-weight="400" font-style="italic" xml:space="preserve">undone?</text><text x="26" y="163.36" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="1.8" xml:space="preserve">SOUNDS LIKE</text><text x="26" y="177.36" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="36" y="177.36" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="normal" xml:space="preserve">“It shouldn’t fail.”</text><text x="26" y="189.856" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="36" y="189.856" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="normal" xml:space="preserve">“We’d restore from backup.” — never tested.</text><text x="26" y="202.35199999999998" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="36" y="202.35199999999998" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.8" font-weight="400" font-style="normal" xml:space="preserve">“We’d fix it manually.”</text><text x="26" y="219.688" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.2" font-weight="700" font-style="normal" letter-spacing="1.8" xml:space="preserve">THE ROUTE</text><text x="26" y="233.688" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.8" font-weight="400" font-style="normal" xml:space="preserve">Write the failure down and write the recovery beside it. A new version</text><text x="26" y="248.584" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.8" font-weight="400" font-style="normal" xml:space="preserve">never overwrites the old one. Money that cannot be allocated is</text><text x="26" y="263.48" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.8" font-weight="400" font-style="normal" xml:space="preserve">reported, never absorbed. Then perform the recovery once, on</text><text x="26" y="278.376" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.8" font-weight="400" font-style="normal" xml:space="preserve">purpose, while nothing is on fire.</text><path d="M31 331.186 L329 331.186 C331.762 331.186 334 328.948 334 326.186 L334 291.506 C334 288.744 331.762 286.506 329 286.506 L31 286.506 C28.239 286.506 26 288.744 26 291.506 L26 326.186 C26 328.948 28.239 331.186 31 331.186 Z" fill="rgb(17,24,35)" stroke="none" stroke-width="1.6"/><path d="M26 286.506h2.6v44.68h-2.6Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1.6"/><text x="40" y="300.506" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">When did you last actually perform the recovery, rather than</text><text x="40" y="313.846" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="700" font-style="normal" xml:space="preserve">describe it?</text><path d="M26 610 L334 610" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="26" y="623" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">THY-QYRIS-QC-001  ·  THY-QC1-0000-MASTER</text><text x="308.258" y="623" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">12 / 23</text></svg></div></div><div class="pg" data-page="13" style="width:360px;height:640px"><div style="transform:scale(1);transform-origin:0 0;width:360px;height:640px"><svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640"><path d="M0 0h360v640h-360Z" fill="rgb(10,14,20)" stroke="none" stroke-width="1"/><path d="M0 0h360v3h-360Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1"/><text x="26" y="30" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">QYRIS QUICKCHECK</text><text x="269.456" y="30" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">DISPOSITION</text><path d="M26 38 L334 38" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><path d="M26.35 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.683 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M37.017 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M26.35 53.68299999999997h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.333 53.33299999999999h4.427v4.427h-4.427Z" fill="rgb(224,179,91)" stroke="none" stroke-width="0.7"/><path d="M37.017 53.68299999999997h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M26.35 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.683 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M37.017 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><text x="54" y="60" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7" font-weight="700" font-style="normal" letter-spacing="2.2" xml:space="preserve">DISPOSITION</text><text x="26" y="96" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="21" font-weight="700" font-style="normal" xml:space="preserve">Three words, and only three</text><path d="M26 107.72000000000003 L72 107.72000000000003" fill="none" stroke="rgb(224,179,91)" stroke-width="1.6"/><path d="M32 132.5 L71.91 132.5 C75.223 132.5 77.91 129.81400000000002 77.91 126.5 L77.91 126 C77.91 122.68600000000004 75.223 120 71.91 120 L32 120 C28.686 120 26 122.68600000000004 26 126 L26 126.5 C26 129.81400000000002 28.686 132.5 32 132.5 Z" fill="none" stroke="rgb(47,107,70)" stroke-width="0.9"/><text x="34" y="128" fill="rgb(111,191,144)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.8" font-weight="700" font-style="normal" letter-spacing="1.2" xml:space="preserve">ROUTED</text><text x="26" y="144" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="400" font-style="normal" xml:space="preserve">Handled in this pass, or the route is written down with an owner and a date</text><text x="26" y="156.89999999999998" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="400" font-style="normal" xml:space="preserve">against it. Routed is not “we discussed it”.</text><path d="M32 179.45999999999998 L59.31 179.45999999999998 C62.623 179.45999999999998 65.31 176.774 65.31 173.45999999999998 L65.31 172.95999999999998 C65.31 169.64600000000002 62.623 166.95999999999998 59.31 166.95999999999998 L32 166.95999999999998 C28.686 166.95999999999998 26 169.64600000000002 26 172.95999999999998 L26 173.45999999999998 C26 176.774 28.686 179.45999999999998 32 179.45999999999998 Z" fill="none" stroke="rgb(107,90,47)" stroke-width="0.9"/><text x="34" y="174.95999999999998" fill="rgb(208,169,79)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.8" font-weight="700" font-style="normal" letter-spacing="1.2" xml:space="preserve">HELD</text><text x="26" y="190.95999999999998" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="400" font-style="normal" xml:space="preserve">Real, and it needs an authority you do not have. Name the authority, name what</text><text x="26" y="203.86" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="400" font-style="normal" xml:space="preserve">it waits on, and name what the waiting costs per week. Held is a legitimate</text><text x="26" y="216.76" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="400" font-style="normal" xml:space="preserve">answer. Held with no name attached is not.</text><path d="M32 239.32 L60.071 239.32 C63.385 239.32 66.071 236.63400000000001 66.071 233.32 L66.071 232.82 C66.071 229.50599999999997 63.385 226.82 60.071 226.82 L32 226.82 C28.686 226.82 26 229.50599999999997 26 232.82 L26 233.32 C26 236.63400000000001 28.686 239.32 32 239.32 Z" fill="none" stroke="rgb(107,50,50)" stroke-width="0.9"/><text x="34" y="234.82" fill="rgb(224,138,138)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.8" font-weight="700" font-style="normal" letter-spacing="1.2" xml:space="preserve">OPEN</text><text x="26" y="250.82" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="400" font-style="normal" xml:space="preserve">Found, no route yet. The dangerous one, because it looks like progress. Every</text><text x="26" y="263.72" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="400" font-style="normal" xml:space="preserve">OPEN gets a date before the pass closes, even if the date is only “decide by</text><text x="26" y="276.62" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="400" font-style="normal" xml:space="preserve">Friday”.</text><path d="M32 348.48 L328 348.48 C331.314 348.48 334 345.794 334 342.48 L334 296.68 C334 293.366 331.314 290.68 328 290.68 L32 290.68 C28.686 290.68 26 293.366 26 296.68 L26 342.48 C26 345.794 28.686 348.48 32 348.48 Z" fill="rgb(17,24,35)" stroke="none" stroke-width="0.9"/><path d="M26 290.68h2.6v57.8h-2.6Z" fill="rgb(224,179,91)" stroke="none" stroke-width="0.9"/><text x="40" y="305.68" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.4" font-weight="700" font-style="normal" xml:space="preserve">No gap is reported and left unrouted where a safe, reversible route</text><text x="40" y="318.28" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.4" font-weight="700" font-style="normal" xml:space="preserve">exists. If the route is safe and you can undo it, take it now and write</text><text x="40" y="330.88" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.4" font-weight="700" font-style="normal" xml:space="preserve">ROUTED.</text><path d="M26 610 L334 610" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="26" y="623" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">THY-QYRIS-QC-001  ·  THY-QC1-0000-MASTER</text><text x="308.258" y="623" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">13 / 23</text></svg></div></div><div class="pg" data-page="14" style="width:360px;height:640px"><div style="transform:scale(1);transform-origin:0 0;width:360px;height:640px"><svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640"><path d="M0 0h360v640h-360Z" fill="rgb(10,14,20)" stroke="none" stroke-width="1"/><path d="M0 0h360v3h-360Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1"/><text x="26" y="30" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">QYRIS QUICKCHECK</text><text x="287.191" y="30" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">PLATE 06</text><path d="M26 38 L334 38" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="220" y="598" fill="rgb(24,34,47)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="120" font-weight="700" font-style="normal" xml:space="preserve">06</text><path d="M26.35 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.683 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M37.017 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M26.35 53.68299999999997h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.333 53.33299999999999h4.427v4.427h-4.427Z" fill="rgb(224,179,91)" stroke="none" stroke-width="0.7"/><path d="M37.017 53.68299999999997h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M26.35 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.683 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M37.017 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><text x="54" y="60" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7" font-weight="700" font-style="normal" letter-spacing="2.2" xml:space="preserve">CLOSING THE PASS</text><text x="26" y="96" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="21" font-weight="700" font-style="normal" xml:space="preserve">Scoring and the readiness line</text><text x="26" y="116" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">A pass ends in one sentence you can say out loud without softening it.</text><path d="M26 127.03999999999996 L72 127.03999999999996" fill="none" stroke="rgb(224,179,91)" stroke-width="1.6"/><path d="M34 185.32 L326 185.32 C330.418 185.32 334 181.738 334 177.32 L334 151.32 C334 146.902 330.418 143.32 326 143.32 L34 143.32 C29.582 143.32 26 146.902 26 151.32 L26 177.32 C26 181.738 29.582 185.32 34 185.32 Z" fill="rgb(17,24,35)" stroke="rgb(138,100,21)" stroke-width="0.9"/><text x="39" y="159.32" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6" font-weight="700" font-style="normal" letter-spacing="1.8" xml:space="preserve">READINESS LINE</text><text x="39" y="176.32" fill="rgb(224,179,91)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="10.6" font-weight="700" font-style="normal" xml:space="preserve">9 inspected · 7 routed · 2 held against a named authority · 0 open.</text><text x="26" y="205.32" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="700" font-style="normal" xml:space="preserve">01</text><text x="49" y="205.32" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="700" font-style="normal" xml:space="preserve">Zero open is the bar to move</text><text x="49" y="219.32" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">An OPEN item is a gap you have seen and not decided about.</text><text x="49" y="233.12" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">Moving with one is a choice; make it deliberately and write it down.</text><text x="26" y="250.60000000000002" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="700" font-style="normal" xml:space="preserve">02</text><text x="49" y="250.60000000000002" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="700" font-style="normal" xml:space="preserve">Held may be non-zero, and must be named</text><text x="49" y="264.6" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">Every HELD line names the authority, what it waits on, and the</text><text x="49" y="278.4" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">weekly cost of waiting. Three HELD items with owners beat one</text><text x="49" y="292.2" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">vague “in progress”.</text><text x="26" y="309.68" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="700" font-style="normal" xml:space="preserve">03</text><text x="49" y="309.68" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="700" font-style="normal" xml:space="preserve">Nine routed and no evidence is not a pass</text><text x="49" y="323.68" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">Spot-check two routes at random. Ask for the proof, not the plan. If</text><text x="49" y="337.48" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">neither survives, run the pass again properly.</text><text x="26" y="354.96" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="700" font-style="normal" xml:space="preserve">04</text><text x="49" y="354.96" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="10.2" font-weight="700" font-style="normal" xml:space="preserve">Do not re-score to look better</text><text x="49" y="368.96" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">The count is a record, not a grade. A pass that flatters you has cost</text><text x="49" y="382.76" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">you the only thing it was for.</text><path d="M26 610 L334 610" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="26" y="623" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">THY-QYRIS-QC-001  ·  THY-QC1-0000-MASTER</text><text x="308.258" y="623" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">14 / 23</text></svg></div></div><div class="pg" data-page="15" style="width:360px;height:640px"><div style="transform:scale(1);transform-origin:0 0;width:360px;height:640px"><svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640"><path d="M0 0h360v640h-360Z" fill="rgb(10,14,20)" stroke="none" stroke-width="1"/><path d="M0 0h360v3h-360Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1"/><text x="26" y="30" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">QYRIS QUICKCHECK</text><text x="287.191" y="30" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">PLATE 06</text><path d="M26 38 L334 38" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="220" y="598" fill="rgb(24,34,47)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="120" font-weight="700" font-style="normal" xml:space="preserve">06</text><path d="M26.35 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.683 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M37.017 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M26.35 53.68299999999997h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.333 53.33299999999999h4.427v4.427h-4.427Z" fill="rgb(224,179,91)" stroke="none" stroke-width="0.7"/><path d="M37.017 53.68299999999997h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M26.35 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.683 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M37.017 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><text x="54" y="60" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7" font-weight="700" font-style="normal" letter-spacing="2.2" xml:space="preserve">CLOSING THE PASS</text><text x="26" y="96" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="21" font-weight="700" font-style="normal" xml:space="preserve">Blocker card</text><path d="M26 107.72000000000003 L72 107.72000000000003" fill="none" stroke="rgb(224,179,91)" stroke-width="1.6"/><path d="M34 283.56 L326 283.56 C330.418 283.56 334 279.978 334 275.56 L334 136 C334 131.582 330.418 128 326 128 L34 128 C29.582 128 26 131.582 26 136 L26 275.56 C26 279.978 29.582 283.56 34 283.56 Z" fill="rgb(13,19,28)" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="40" y="145" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.4" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">BLOCKER CARD · HELD OR OPEN</text><text x="40" y="161" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="50" y="161" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">ID and one-line name — so it can be carried forward verbatim.</text><text x="40" y="177.32" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="50" y="177.32" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">Severity — HARD (nothing proceeds), BY RULE (held deliberately),</text><text x="50" y="190.64" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">EVIDENCE GAP (unproven), or COST (needs spend).</text><text x="40" y="206.95999999999998" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="50" y="206.95999999999998" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">The consequence, carried honestly — what is untrue or unknown</text><text x="50" y="220.27999999999997" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">while this stands.</text><text x="40" y="236.60000000000002" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="50" y="236.60000000000002" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">What it needs — the specific authority, account, signature, person or</text><text x="50" y="249.92000000000002" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">measurement.</text><text x="40" y="266.24" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="50" y="266.24" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">Who can give it — a name, not a department.</text><path d="M26 610 L334 610" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="26" y="623" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">THY-QYRIS-QC-001  ·  THY-QC1-0000-MASTER</text><text x="308.258" y="623" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">15 / 23</text></svg></div></div><div class="pg" data-page="16" style="width:360px;height:640px"><div style="transform:scale(1);transform-origin:0 0;width:360px;height:640px"><svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640"><path d="M0 0h360v640h-360Z" fill="rgb(10,14,20)" stroke="none" stroke-width="1"/><path d="M0 0h360v3h-360Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1"/><text x="26" y="30" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">QYRIS QUICKCHECK</text><text x="287.191" y="30" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">PLATE 07</text><path d="M26 38 L334 38" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="220" y="598" fill="rgb(24,34,47)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="120" font-weight="700" font-style="normal" xml:space="preserve">07</text><path d="M26.35 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.683 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M37.017 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M26.35 53.68299999999997h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.333 53.33299999999999h4.427v4.427h-4.427Z" fill="rgb(224,179,91)" stroke="none" stroke-width="0.7"/><path d="M37.017 53.68299999999997h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M26.35 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.683 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M37.017 59.016000000000055h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><text x="54" y="60" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7" font-weight="700" font-style="normal" letter-spacing="2.2" xml:space="preserve">QUALITY CONTROL</text><text x="26" y="96" fill="rgb(244,239,230)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="21" font-weight="700" font-style="normal" xml:space="preserve">Five ways a pass goes weak</text><text x="26" y="116" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">Each of these looks like a completed pass from the outside. Each is worth</text><text x="26" y="130.26" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.2" font-weight="400" font-style="normal" xml:space="preserve">nothing.</text><path d="M26 141.3 L72 141.3" fill="none" stroke="rgb(224,179,91)" stroke-width="1.6"/><text x="26" y="169.57999999999998" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.4" font-weight="700" font-style="normal" xml:space="preserve">01</text><text x="48" y="169.57999999999998" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.8" font-weight="700" font-style="normal" xml:space="preserve">The nod-through</text><text x="48" y="180.57999999999998" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.2" font-weight="400" font-style="italic" xml:space="preserve">Nine ticks in four minutes.</text><text x="48" y="192.57999999999998" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.4" font-weight="400" font-style="normal" xml:space="preserve">Require one verbatim quote or one artefact per inspection. If you cannot</text><text x="48" y="205.012" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.4" font-weight="400" font-style="normal" xml:space="preserve">quote or point, you did not inspect.</text><path d="M26 213.09199999999998 L334 213.09199999999998" fill="none" stroke="rgb(36,48,63)" stroke-width="0.5"/><text x="26" y="230.09199999999998" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.4" font-weight="700" font-style="normal" xml:space="preserve">02</text><text x="48" y="230.09199999999998" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.8" font-weight="700" font-style="normal" xml:space="preserve">The blame pass</text><text x="48" y="241.09199999999998" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.2" font-weight="400" font-style="italic" xml:space="preserve">Findings aimed at people.</text><text x="48" y="253.09199999999998" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.4" font-weight="400" font-style="normal" xml:space="preserve">Route to a mechanism, never a name. The record is what failed, not who</text><text x="48" y="265.524" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.4" font-weight="400" font-style="normal" xml:space="preserve">was near it. People read the sheet; make it safe to hand over.</text><path d="M26 273.604 L334 273.604" fill="none" stroke="rgb(36,48,63)" stroke-width="0.5"/><text x="26" y="290.604" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.4" font-weight="700" font-style="normal" xml:space="preserve">03</text><text x="48" y="290.604" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.8" font-weight="700" font-style="normal" xml:space="preserve">The list with no owner</text><text x="48" y="301.604" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.2" font-weight="400" font-style="italic" xml:space="preserve">Findings with nothing beside them.</text><text x="48" y="313.604" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.4" font-weight="400" font-style="normal" xml:space="preserve">Every ROUTED carries an owner and a date. Every HELD carries an</text><text x="48" y="326.036" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.4" font-weight="400" font-style="normal" xml:space="preserve">authority. Unowned findings decay into folklore.</text><path d="M26 334.116 L334 334.116" fill="none" stroke="rgb(36,48,63)" stroke-width="0.5"/><text x="26" y="351.116" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.4" font-weight="700" font-style="normal" xml:space="preserve">04</text><text x="48" y="351.116" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.8" font-weight="700" font-style="normal" xml:space="preserve">The silent drop</text><text x="48" y="362.116" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.2" font-weight="400" font-style="italic" xml:space="preserve">A finding that vanishes between passes.</text><text x="48" y="374.116" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.4" font-weight="400" font-style="normal" xml:space="preserve">Carry every OPEN and HELD forward verbatim into the next sheet, with its</text><text x="48" y="386.548" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.4" font-weight="400" font-style="normal" xml:space="preserve">age in days. Age is the most honest metric on the page.</text><path d="M26 394.628 L334 394.628" fill="none" stroke="rgb(36,48,63)" stroke-width="0.5"/><text x="26" y="411.628" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.4" font-weight="700" font-style="normal" xml:space="preserve">05</text><text x="48" y="411.628" fill="rgb(244,239,230)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9.8" font-weight="700" font-style="normal" xml:space="preserve">The polish trap</text><text x="48" y="422.628" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.2" font-weight="400" font-style="italic" xml:space="preserve">Fixing the readable things, leaving the unproven ones.</text><text x="48" y="434.628" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.4" font-weight="400" font-style="normal" xml:space="preserve">When short of time, run inspections 4 and 9 first. Unproven claims and</text><text x="48" y="447.06" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.4" font-weight="400" font-style="normal" xml:space="preserve">untested recovery are what reach customers.</text><path d="M26 455.14 L334 455.14" fill="none" stroke="rgb(36,48,63)" stroke-width="0.5"/><path d="M26 610 L334 610" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="26" y="623" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">THY-QYRIS-QC-001  ·  THY-QC1-0000-MASTER</text><text x="308.258" y="623" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">16 / 23</text></svg></div></div><div class="pg" data-page="17" style="width:360px;height:640px"><div style="transform:scale(1);transform-origin:0 0;width:360px;height:640px"><svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640"><path d="M0 0h360v640h-360Z" fill="rgb(10,14,20)" stroke="none" stroke-width="1"/><path d="M0 0h360v3h-360Z" fill="rgb(224,179,91)" stroke="none" stroke-width="1"/><text x="26" y="30" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">QYRIS QUICKCHECK</text><text x="287.191" y="30" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">PLATE 07</text><path d="M26 38 L334 38" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="220" y="598" fill="rgb(24,34,47)" font-family='"Liberation Serif", "Times New Roman", serif' font-size="120" font-weight="700" font-style="normal" xml:space="preserve">07</text><path d="M26.35 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(138,100,21)" stroke-width="0.7"/><path d="M31.683 48.35h3.727v3.727h-3.727Z" fill= rve">·</text><text x="50" y="161" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">One inspection at a time, out loud, going round the room. Twenty-five</text><text x="50" y="174.32" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">minutes.</text><text x="40" y="190.64" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="50" y="190.64" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">The person closest to the work speaks last, so the room’s first answer</text><text x="50" y="203.95999999999998" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">is not theirs.</text><text x="40" y="220.27999999999997" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="50" y="220.27999999999997" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">Write findings in the words that were actually said. Cleaned-up</text><text x="50" y="233.60000000000002" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">language hides the gap.</text><text x="40" y="249.92000000000002" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="700" font-style="normal" xml:space="preserve">·</text><text x="50" y="249.92000000000002" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">Close on the readiness line, read aloud, by the person who owns the</text><text x="50" y="263.24" fill="rgb(200,206,218)" font-family='"Liberation Sans", Arial, sans-serif' font-size="9" font-weight="400" font-style="normal" xml:space="preserve">thing.</text><path d="M26 610 L334 610" fill="none" stroke="rgb(36,48,63)" stroke-width="0.7"/><text x="26" y="623" fill="rgb(142,155,173)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">THY-QYRIS-QC-001  ·  THY-QC1-0000-MASTER</text><text x="308.258" y="623" fill="rgb(224,179,91)" font-family='"Liberation Sans", Arial, sans-serif' font-size="5.9" font-weight="700" font-style="normal" letter-spacing="1.1" xml:space="preserve">17 / 23</text></svg></div></div><div class="pg" data-page="18" style="width:360px;height:640px"><div style="transform:scale(1);transform-origin:0 0;width:360px;height:640px"><svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640"><path d="M0 0h360v640h-360Z" fill="rgb(244,239,230)" stroke="none" stroke-width="1"/><path d="M0 0h360v3h-360Z" fill="rgb(138,100,21)" stroke="none" stroke-width="1"/><text x="26" y="30" fill="rgb(95,106,120)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve">QYRIS QUICKCHECK</text><text x="334" y="30" fill="rgb(138,100,21)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.6" font-weight="700" font-style="normal" letter-spacing="2" xml:space="preserve"></text><path d="M26 38 L334 38" fill="none" stroke="rgb(202,187,159)" stroke-width="0.7"/><path d="M26.35 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(111,75,35)" stroke-width="0.7"/><path d="M31.683 48.35h3.727v3.727h-3.727Z" fill="none" stroke="rgb(111,75,35)" stroke-width="0 erequisite</text><path d="M294 166.07999999999998 L328 166.07999999999998 C331.314 166.07999999999998 334 163.394 334 160.07999999999998 L334 160.07999999999998 C334 156.76600000000002 331.314 154.07999999999998 328 154.07999999999998 L294 154.07999999999998 C290.686 154.07999999999998 288 156.76600000000002 288 160.07999999999998 L288 160.07999999999998 C288 163.394 290.686 166.07999999999998 294 166.07999999999998 Z" fill="none" stroke="rgb(44,107,71)" stroke-width="0.8"/><text x="294.79" y="161.57999999999998" fill="rgb(44,107,71)" font-family='"Liberation Sans", Arial, sans-serif' font-size="6.4" font-weight="700" font-style="normal" letter-spacing="0.9" xml:space="preserve">ROUTED</text><text x="26" y="174.57999999999998" fill="rgb(44,54,68)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7.8" font-weight="400" font-style="normal" xml:space="preserve">Nothing checks that the file a customer downloads is the final build. The link points at</text><text x="26" y="185.57999999999998" fill="rgb(44,54,68)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7.8" font-weight="400" font-style="normal" xml:space="preserve">whatever is in the folder.</text><text x="26" y="197.57999999999998" fill="rgb(95,106,120)" font-family='"Liberation Sans", Arial, sans-serif' font-size="7.8" font-weight="400" font-style="normal" xml:space="preserve">Delivery reads a named build with a checksum; a mismatch refuses to deliver. Me · today</text><path d="M26 203.57999999999998 L334 203.57999999999998" fill="none" stroke="rgb(202,187,159)" stroke-width="0.4"/><text x="26" y="213.57999999999998" fill="rgb(15,22,32)" font-family='"Liberation Sans", Arial, sans-serif' font-size="8.6" font-weight="700" font-style="normal" xml:space="preserve">2 · Hidden handoff</text><path d="M294 218.07999999999998 L328 218.07999999999998 C331.314 218.07999999999998 334 215.394 334 212.07999999999998 L334 212.07999999999998 C334 208.76600000000002 331.314 206.07999999999998 328 206.
