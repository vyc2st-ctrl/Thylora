<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img"
     aria-labelledby="t2 d2" width="1200" height="1500">
  <title id="t2">THYLORA Stuck Loop Reset cover</title>
  <desc id="d2">A dark cover showing a dashed closed loop labelled "try again, same error, start over, same screen", with a single gold arrow breaking out of it toward the word STOP, beneath the title "Get Out of the Click-Again Cycle".</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1310"/><stop offset="0.5" stop-color="#141019"/><stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.2" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#166DD6" stop-opacity="0.2"/><stop offset="1" stop-color="#166DD6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg2)"/>
  <rect width="1200" height="1500" fill="url(#glow2)"/>
  <rect x="0" y="0" width="26" height="1500" fill="#8f3f24"/>
  <rect x="0" y="900" width="26" height="600" fill="#166DD6"/>

  <text x="96" y="150" font-family="Inter,system-ui,sans-serif" font-size="27" font-weight="900"
        letter-spacing="9" fill="#e5b65b">THYLORA</text>
  <text x="96" y="196" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="800"
        letter-spacing="6" fill="#8d8172">QYRIS INSTRUMENT · UTILITY SHELF</text>

  <text x="96" y="420" font-family="Georgia,serif" font-size="112" fill="#f7f0e5">Get Out of the</text>
  <text x="96" y="540" font-family="Georgia,serif" font-size="112" fill="#f7f0e5">Click-Again Cycle</text>
  <text x="96" y="622" font-family="Inter,system-ui,sans-serif" font-size="30" font-weight="800"
        letter-spacing="5" fill="#e5b65b">STUCK LOOP RESET</text>

  <g transform="translate(0,190)">
    <ellipse cx="410" cy="690" rx="250" ry="132" fill="none" stroke="#6d5f4c" stroke-width="5" stroke-dasharray="17 15"/>
    <g font-family="Inter,system-ui,sans-serif" font-size="25" font-weight="900" letter-spacing="3" fill="#a2957f" text-anchor="middle">
      <text x="410" y="528">TRY AGAIN</text>
      <text x="410" y="866">START OVER</text>
    </g>
    <text x="140" y="700" font-family="Inter,system-ui,sans-serif" font-size="25" font-weight="900"
          letter-spacing="3" fill="#a2957f" text-anchor="end">SAME SCREEN</text>
    <text x="680" y="700" font-family="Inter,system-ui,sans-serif" font-size="25" font-weight="900"
          letter-spacing="3" fill="#a2957f">SAME ERROR</text>
    <line x1="668" y1="690" x2="880" y2="690" stroke="#e5b65b" stroke-width="7"/>
    <path d="M866 668 L906 690 L866 712 z" fill="#e5b65b"/>
    <text x="928" y="672" font-family="Inter,system-ui,sans-serif" font-size="46" font-weight="900"
          letter-spacing="4" fill="#e5b65b">STOP.</text>
    <text x="928" y="722" font-family="Georgia,serif" font-size="31" fill="#b9ad97">Capture the</text>
    <text x="928" y="762" font-family="Georgia,serif" font-size="31" fill="#b9ad97">state.</text>
  </g>

  <line x1="96" y1="1300" x2="1104" y2="1300" stroke="#4a4034" stroke-width="2"/>
  <g font-family="Inter,system-ui,sans-serif" font-size="23" font-weight="700" letter-spacing="2.6" fill="#8d8172">
    <text x="96" y="1360">6 PLATES · STATE CARD · ESCALATION SCRIPT</text>
    <text x="96" y="1404">THY-STUCK-LOOP-RESET-001 · EDITION 1 · 2026</text>
  </g>
</svg>
