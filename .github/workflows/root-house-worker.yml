name: ROOT HOUSE — lineage research worker

# Repository-only research worker, separate from the Supabase report check:
# it reads lineage/family.json, searches open archives, and commits candidate
# leads to lineage/leads/ for review. It does not read/write Supabase or create
# digital products.

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'lineage/family.json'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests
        run: npm test
      - name: Run worker
        run: node scripts/lineage-worker.mjs
      - name: Describe worker scope
        run: |
          echo "## Root House scheduled worker" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scope: repository-only lineage research." >> "$GITHUB_STEP_SUMMARY"
          echo "- Output: candidate leads in lineage/leads/ for human review." >> "$GITHUB_STEP_SUMMARY"
          echo "- Supabase access and digital-product generation: not performed by this workflow." >> "$GITHUB_STEP_SUMMARY"
      - name: Commit leads
        run: |
          git config user.name "root-house-worker"
          git config user.email "root-house-worker@users.noreply.github.com"
          git add lineage/leads
          git diff --cached --quiet || git commit -m "Root House worker: leads $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
