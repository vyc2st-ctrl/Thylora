name: Patch THYLORA dashboard R7

on:
  push:
    paths:
      - '.github/workflows/patch-dashboard-r7.yml'

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build R7 from protected R5 floor
        shell: python
        run: |
          from pathlib import Path
          p=Path('dashboard-current-head.html')
          s=p.read_text()
          if 'THY-UI-20260823-0925-R5' not in s:
              raise SystemExit('R5 floor marker missing; refuse silent patch')
          s=s.replace('THY-UI-20260823-0925-R5','THY-UI-20260823-1635-R7')
          s=s.replace('Good morning, Chairman Vyc.','Welcome back, Vyc.')
          s=s.replace('.card{border:1px solid #26313e;background:#0b121a;border-radius:12px;padding:10px}', '.card{border:1px solid #26313e;background:#0b121a;border-radius:12px;padding:10px}.work-card{cursor:pointer;transition:border-color .15s ease,transform .15s ease}.work-card:hover,.work-card:focus-within{border-color:#8d6a2c}.work-card:active{transform:scale(.995)}.reply-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.reply-tools button,.reply-tools select{font:inherit;border:1px solid #3a4654;background:#171f2a;color:#fff;border-radius:9px;padding:6px 9px}.voice-live{color:#78d49b}' )
          s=s.replace("let activeDepartment=null,departmentRows=[],moduleRows=[],activeModule=null,promptRows=[]", "let activeDepartment=null,departmentRows=[],moduleRows=[],activeModule=null,activeWork=null,activeWorkContext=null,promptRows=[],talkRows=[],speechRate=1.05,speechPaused=false,currentUtterance=null,voiceSession=null")

          marker='async function loadAll(){'
          insert=r'''
function workCard(x,kind){return '<button class="card work-card" style="width:100%;text-align:left;color:inherit" data-work-kind="'+esc(kind)+'" data-work-id="'+esc(x.idea_id||x.product_id||x.production_id||x.team_code||x.id||'')+'"><div class="card-title">'+esc(titleFor(x))+'</div>'+(summaryFor(x)?'<div class="summary">'+esc(summaryFor(x))+'</div>':'')+'<div class="meta" style="margin-top:8px">Open · talk · keep working</div></button>'}
async function loadIdeas(){try{const d=await table('thylora_idea_workspaces','select=*&limit=40');$('ideas').innerHTML=d.length?d.map(x=>workCard(x,'idea')).join(''):'<div class="empty">No ideas yet.</div>'}catch(e){$('ideas').innerHTML='<div class="empty">Ideas are unavailable in this session.</div>'}}
async function loadProductsInteractive(){try{const d=await table('products','select=*&order=created_at.desc&limit=20');$('products').innerHTML=d.length?d.map(x=>workCard(x,'product')).join(''):'<div class="empty">No products yet.</div>'}catch(e){$('products').innerHTML='<div class="empty">Products are unavailable in this session.</div>'}}
async function loadProductionsInteractive(){try{const d=await table('productions','select=*&order=created_at.desc&limit=20');$('productions').innerHTML=d.length?d.map(x=>workCard(x,'production')).join(''):'<div class="empty">No productions yet.</div>'}catch(e){$('productions').innerHTML='<div class="empty">Productions are unavailable in this session.</div>'}}
async function loadSports(){const el=$('sportsTeams');if(!el)return;try{const d=await table('sports_team_registry','select=*&order=updated_at.desc&limit=20');el.innerHTML=d.length?d.map(x=>workCard(x,'team')).join(''):'<div class="empty">No teams yet.</div>'}catch(e){el.innerHTML='<div class="empty">Sports teams are unavailable in this session.</div>'}}
function selectedContext(kind,x){return {kind,id:x.idea_id||x.product_id||x.production_id||x.team_code||x.id||'',title:titleFor(x),state:x.state||x.status||x.stage||'',department_code:kind==='team'?'SPORTS_FRONT_OFFICE':(kind==='production'?'CREATIVE_AND_PRODUCTION':'PRODUCT_DEVELOPMENT'),next_action:x.next_action||'',summary:summaryFor(x),source_table:kind==='idea'?'thylora_idea_workspaces':kind==='product'?'products':kind==='production'?'productions':'sports_team_registry'}}
async function openWork(kind,id){if(!id)return;const cfg={idea:{table:'thylora_idea_workspaces',field:'idea_id',dept:'PRODUCT_DEVELOPMENT',label:'IDEA',studio:true},product:{table:'products',field:'product_id',dept:'PRODUCT_DEVELOPMENT',label:'PRODUCT',studio:false},production:{table:'productions',field:'production_id',dept:'CREATIVE_AND_PRODUCTION',label:'PRODUCTION',studio:true},team:{table:'sports_team_registry',field:'team_code',dept:'SPORTS_FRONT_OFFICE',label:'TEAM',studio:false}}[kind];if(!cfg)return;$('viewerSection').textContent=cfg.label;$('viewerTitle').textContent='Opening…';$('viewer').classList.add('open');setDrawer(false);lockBody(true);const body=$('viewerBody');body.innerHTML='<div class="empty">Loading…</div>';try{const d=await table(cfg.table,'select=*&'+cfg.field+'=eq.'+encodeURIComponent(id)+'&limit=1');const x=d[0];if(!x){body.innerHTML='<div class="empty">Record not found.</div>';return}activeWork={kind,cfg,record:x};$('viewerTitle').textContent=titleFor(x);const studioButton=cfg.studio?'<button class="btn" id="workStudio">Studio</button>':'';body.innerHTML='<div class="panel"><span class="pill">'+esc(cfg.label)+'</span>'+recordCard(x)+'<div class="actions" style="margin-top:12px"><button class="btn primary" id="workTalk">Talk</button><button class="btn" id="workDevelop">Keep working</button>'+studioButton+'</div><div class="sub" style="margin-top:10px">This room remembers the selected record behind the text box. Type only what you want to say.</div></div>';setTimeout(()=>{if($('workTalk'))$('workTalk').onclick=()=>openWorkTalk(false,false);if($('workDevelop'))$('workDevelop').onclick=()=>openWorkTalk(false,true);if($('workStudio'))$('workStudio').onclick=()=>openWorkTalk(true,false)},0)}catch(e){body.innerHTML='<div class="bad">'+esc(e.message)+'</div>'}}
function openWorkTalk(toStudio=false,develop=false){if(!activeWork)return;const x=activeWork.record;activeWorkContext=selectedContext(activeWork.kind,x);let code=activeWork.cfg.dept;if(toStudio){code='CREATIVE_AND_PRODUCTION';activeWorkContext.department_code=code}closeViewer();openTalk(code);setTimeout(()=>{const box=$('talkInput');box.value='';box.placeholder=(develop?'Keep working on ':'Talk about ')+titleFor(x);box.focus();$('talkStatus').textContent=develop?'Ready — this exact record is selected.':'Selected: '+titleFor(x)},120)}
function plainText(html){const d=document.createElement('div');d.innerHTML=html;return (d.textContent||'').trim()}
function speakReply(i){const r=talkRows[i];if(!r||!r.response_message)return;window.speechSynthesis.cancel();currentUtterance=new SpeechSynthesisUtterance(plainText(r.response_message));currentUtterance.rate=speechRate;currentUtterance.onend=()=>{speechPaused=false;currentUtterance=null};window.speechSynthesis.speak(currentUtterance)}
function stopSpeech(){window.speechSynthesis.cancel();speechPaused=false;currentUtterance=null}
function toggleSpeech(){if(!window.speechSynthesis.speaking)return;if(window.speechSynthesis.paused){window.speechSynthesis.resume();speechPaused=false}else{window.speechSynthesis.pause();speechPaused=true}}
function setRate(v){speechRate=Math.max(.6,Math.min(1.8,Number(v)||1.05));if(window.speechSynthesis.speaking&&currentUtterance){const text=currentUtterance.text;stopSpeech();currentUtterance=new SpeechSynthesisUtterance(text);currentUtterance.rate=speechRate;window.speechSynthesis.speak(currentUtterance)}}
function stopVoiceSession(){if(voiceSession){voiceSession.keep=false;try{voiceSession.rec.stop()}catch{}voiceSession=null}}
function startVoiceLong(targetId,statusId){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$(statusId).textContent='Use the iPad keyboard microphone here.';$(targetId).focus();return}if(voiceSession){stopVoiceSession();$(statusId).textContent='Talk stopped.';return}const rec=new SR();const session={rec,keep:true,final:''};voiceSession=session;rec.lang='en-US';rec.interimResults=true;rec.continuous=true;rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)session.final+=(session.final?' ':'')+t.trim();else interim+=t}$(statusId).textContent=interim?'Hearing: '+interim:'Listening… tap Talk again when done.'};rec.onerror=e=>{$(statusId).textContent='Voice paused: '+e.error};rec.onend=()=>{if(session.final){const box=$(targetId);box.value=(box.value.trim()?box.value.trim()+' ':'')+session.final.trim();session.final='';box.focus()}if(session.keep&&voiceSession===session){$(statusId).textContent='Listening…';setTimeout(()=>{try{rec.start()}catch{}},450)}else if(voiceSession===session){voiceSession=null;$(statusId).textContent='Voice captured — review, then send.'}};$(statusId).textContent='Listening… tap Talk again when done.';try{rec.start()}catch(e){voiceSession=null;$(statusId).textContent='Voice could not start.'}}
'''
          if marker not in s: raise SystemExit('loadAll marker missing')
          s=s.replace(marker,insert+'\n'+marker,1)

          old="loadSimple('idea_registry','ideas','select=idea_id,title,state,priority,department_owner,current_blocker,next_action,updated_at&order=updated_at.desc&limit=12'),loadSimple('products','products','select=*&order=created_at.desc&limit=8')"
          if old not in s: raise SystemExit('R5 idea loader missing')
          s=s.replace(old,"loadIdeas(),loadProductsInteractive()",1)
          s=s.replace("loadSimple('productions','productions','select=*&order=created_at.desc&limit=8')","loadProductionsInteractive(),loadSports()",1)

          sports='<h2 id="sports-section" class="section-title">Sports & Games</h2><section class="grid"><article class="panel"><h3>Sports Front Office</h3><div class="actions" style="margin-bottom:10px"><button class="btn primary" data-open-talk="SPORTS_FRONT_OFFICE">Talk Sports</button></div><div id="sportsTeams" class="list"></div></article></section>'
          dept='<h2 id="departments-section" class="section-title">Departments</h2>'
          if dept not in s: raise SystemExit('Departments heading missing')
          s=s.replace(dept,sports+dept,1)

          # send selected work context behind the text box
          send_old="await invoke('thylora-department-talk',{department_code:activeDepartment.department_code,module_key:activeModule?.module_key||null,message})"
          send_new="await invoke('thylora-department-talk',{department_code:activeDepartment.department_code,module_key:activeModule?.module_key||null,work_context:activeWorkContext,message})"
          if send_old not in s: raise SystemExit('Department send marker missing')
          s=s.replace(send_old,send_new,1)

          # stable conversation scroll + Hear tools
          hist_old="const rows=d.slice().reverse();h.innerHTML=rows.length?rows.map((r,i)=>'<div class=\"talk-msg '+(i===rows.length-1?'latest':'')+'\"><div class=\"meta\">'+esc(r.created_at?new Date(r.created_at).toLocaleString():'')+'</div><div class=\"who\">You</div><div>'+esc(r.user_message||'')+'</div>'+(r.response_message?'<div class=\"who\">Department</div><div class=\"reply\">'+formatReply(r.response_message)+'</div>':'')+'</div>').join(''):'<div class=\"empty\">No prior conversation yet.</div>';if(forceBottom||rows.length)requestAnimationFrame(()=>h.scrollTop=h.scrollHeight)"
          hist_new="const nearBottom=(h.scrollHeight-h.scrollTop-h.clientHeight)<120;const rows=d.slice().reverse();talkRows=rows;h.innerHTML=rows.length?rows.map((r,i)=>'<div class=\"talk-msg '+(i===rows.length-1?'latest':'')+'\"><div class=\"meta\">'+esc(r.created_at?new Date(r.created_at).toLocaleString():'')+'</div><div class=\"who\">You</div><div>'+esc(r.user_message||'')+'</div>'+(r.response_message?'<div class=\"who\">Department</div><div class=\"reply\">'+formatReply(r.response_message)+'</div><div class=\"reply-tools\"><button data-hear-index=\"'+i+'\">🔊 Hear</button><button data-speech-toggle>Pause / Resume</button><button data-speech-stop>Stop</button><select data-speech-rate><option value=\"0.8\">0.8×</option><option value=\"1.0\">1×</option><option value=\"1.2\">1.2×</option><option value=\"1.4\">1.4×</option><option value=\"1.6\">1.6×</option></select></div>':'')+'</div>').join(''):'<div class=\"empty\">No prior conversation yet.</div>';if(forceBottom||nearBottom)requestAnimationFrame(()=>h.scrollTop=h.scrollHeight)"
          if hist_old not in s: raise SystemExit('History renderer marker missing')
          s=s.replace(hist_old,hist_new,1)

          # voice buttons toggle long session
          s=s.replace("$('talkVoice').onclick=()=>startVoice('talkInput','talkStatus')","$('talkVoice').onclick=()=>startVoiceLong('talkInput','talkStatus')",1)
          s=s.replace("$('commandVoice').onclick=()=>startVoice('command','commandResult')","$('commandVoice').onclick=()=>startVoiceLong('command','commandResult')",1)

          click_old="const o=e.target.closest('[data-open-talk]');if(o)openTalk(o.dataset.openTalk)"
          click_new="const o=e.target.closest('[data-open-talk]');if(o){activeWorkContext=null;openTalk(o.dataset.openTalk)}const w=e.target.closest('[data-work-kind]');if(w)openWork(w.dataset.workKind,w.dataset.workId);const hi=e.target.closest('[data-hear-index]');if(hi)speakReply(Number(hi.dataset.hearIndex));if(e.target.closest('[data-speech-toggle]'))toggleSpeech();if(e.target.closest('[data-speech-stop]'))stopSpeech();const sr=e.target.closest('[data-speech-rate]');if(sr&&e.type==='click')setRate(sr.value)"
          if click_old not in s: raise SystemExit('Click marker missing')
          s=s.replace(click_old,click_new,1)
          # add change listener for rate
          s=s.replace("document.addEventListener('keydown',e=>{if(e.key==='Escape'){setDrawer(false);closeTalk();closeViewer()}});", "document.addEventListener('change',e=>{const sr=e.target.closest?.('[data-speech-rate]');if(sr)setRate(sr.value)});document.addEventListener('keydown',e=>{if(e.key==='Escape'){setDrawer(false);closeTalk();closeViewer();stopSpeech();stopVoiceSession()}});",1)
          p.write_text(s)
      - name: Verify R7
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'THY-UI-20260823-1635-R7' dashboard-current-head.html
          grep -q 'Welcome back, Vyc.' dashboard-current-head.html
          grep -q 'function openWork' dashboard-current-head.html
          grep -q 'work_context:activeWorkContext' dashboard-current-head.html
          grep -q 'function speakReply' dashboard-current-head.html
          grep -q 'Pause / Resume' dashboard-current-head.html
          grep -q 'function startVoiceLong' dashboard-current-head.html
          grep -q 'nearBottom' dashboard-current-head.html
          grep -q 'Sports & Games' dashboard-current-head.html
          grep -q 'sports_team_registry' dashboard-current-head.html
      - name: Commit R7
        shell: bash
        run: |
          git config user.name 'THYLORA continuity bot'
          git config user.email 'actions@users.noreply.github.com'
          git add dashboard-current-head.html
          git commit -m 'Make R7 actionable with hidden context voice controls and sports'
          git push
