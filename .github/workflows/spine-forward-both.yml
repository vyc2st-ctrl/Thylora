name: THYLORA SPINE FORWARD — Dashboard + App Voice Command

on:
  push:
    paths:
      - '.github/triggers/spine-forward-both.txt'

permissions:
  contents: write

jobs:
  patch-both:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch dashboard and app additively
        shell: python
        run: |
          from pathlib import Path

          MARK='THY-SPINE-FORWARD-VOICE-001'

          css = r'''
          <style id="thy-spine-forward-style">
          .thy-spine-launch{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:120;border:1px solid #b28a3d;background:#17120b;color:#fff;border-radius:999px;padding:12px 16px;font-weight:800;box-shadow:0 12px 34px #0009}
          .thy-spine-panel{position:fixed;z-index:121;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:760px;margin:auto;display:none;flex-direction:column;max-height:82dvh;background:#0c121a;border:1px solid #9b7530;border-radius:20px;box-shadow:0 24px 70px #000d;overflow:hidden}
          .thy-spine-panel.open{display:flex}.thy-spine-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #293342}.thy-spine-head strong{font-size:18px}.thy-spine-close{border:1px solid #384454;background:#141c27;color:#fff;border-radius:10px;padding:8px 11px}
          .thy-spine-body{padding:14px;overflow:auto}.thy-spine-label{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;color:#e0b35b;margin-bottom:7px}.thy-spine-text{width:100%;min-height:150px;resize:vertical;background:#070c12;color:#fff;border:1px solid #3a4654;border-radius:13px;padding:14px;font:17px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
          .thy-spine-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.thy-spine-actions button{border:1px solid #3a4654;background:#171f2a;color:#fff;border-radius:11px;padding:10px 13px;font-weight:750}.thy-spine-actions .primary{background:#6d4f18;border-color:#a0792d}.thy-spine-actions button:disabled{opacity:.55}
          .thy-spine-result{margin-top:12px;border:1px solid #2c3949;background:#0a1018;border-radius:14px;padding:14px;display:none}.thy-spine-result.show{display:block}.thy-spine-result .row{padding:7px 0;border-bottom:1px solid #1f2a36}.thy-spine-result .row:last-child{border-bottom:0}.thy-spine-result b{display:block;color:#e0b35b;font-size:12px;letter-spacing:.06em;margin-bottom:3px}.thy-spine-result span{display:block;font-size:17px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
          .thy-spine-status{margin-top:10px;color:#aeb7c4;font-size:14px;line-height:1.55}.thy-spine-status.good{color:#82d8a0}.thy-spine-status.bad{color:#ff9999}
          .talk-msg .reply,.summary,.card .summary{line-height:1.72;white-space:pre-wrap;overflow-wrap:anywhere}
          @media(max-width:700px){.thy-spine-launch{left:10px;bottom:calc(10px + env(safe-area-inset-bottom));padding:11px 14px}.thy-spine-panel{left:0;right:0;bottom:0;max-width:none;max-height:100dvh;border-radius:18px 18px 0 0}.thy-spine-text{font-size:18px;line-height:1.7;min-height:180px}.thy-spine-result span{font-size:18px;line-height:1.7}}
          </style>
          '''

          html = r'''
          <button type="button" class="thy-spine-launch" id="thySpineLaunch">🎙 THYLORA</button>
          <section class="thy-spine-panel" id="thySpinePanel" aria-label="THYLORA command spine">
            <div class="thy-spine-head"><div><strong>THYLORA Command Spine</strong><div style="font-size:12px;color:#a8b0bc">BACKEND FIRST · route the work · keep custody</div></div><button type="button" class="thy-spine-close" id="thySpineClose">Close</button></div>
            <div class="thy-spine-body">
              <label class="thy-spine-label" for="thySpineText">TELL THYLORA WHAT YOU WANT DONE</label>
              <textarea class="thy-spine-text" id="thySpineText" placeholder="Speak or type naturally. THYLORA checks continuity first, routes the command, and keeps the command in backend custody."></textarea>
              <div class="thy-spine-actions">
                <button type="button" id="thySpineTalk">🎙 Talk</button>
                <button type="button" class="primary" id="thySpineRoute">Route command</button>
                <button type="button" id="thySpineHear">🔊 Hear result</button>
                <button type="button" id="thySpineStop">■ Stop</button>
              </div>
              <div class="thy-spine-status" id="thySpineStatus">Ready. Sign in first for protected command routing.</div>
              <div class="thy-spine-result" id="thySpineResult"></div>
            </div>
          </section>
          '''

          common_js = r'''
          <script id="thy-spine-forward-script">
          (()=>{
            const MARK='THY-SPINE-FORWARD-VOICE-001';
            const URL='https://jvsdxhrfhtlgaknhjxlz.supabase.co';
            const KEY='sb_publishable_ta33XJ9rtS8VljoUYw-GuA_Pi4OycpQ';
            const $=id=>document.getElementById(id);
            const panel=$('thySpinePanel'), launch=$('thySpineLaunch'), close=$('thySpineClose'), text=$('thySpineText'), status=$('thySpineStatus'), result=$('thySpineResult');
            if(!panel||!launch||!text)return;
            const dashboardToken=()=>localStorage.getItem('thy_access_token')||'';
            const appToken=()=>{try{return JSON.parse(sessionStorage.getItem('thylora_app_auth_session')||'null')?.access_token||''}catch{return ''}};
            const token=()=>dashboardToken()||appToken();
            const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            const setStatus=(msg,kind='')=>{status.className='thy-spine-status '+kind;status.textContent=msg};
            const render=d=>{result.innerHTML=`<div class="row"><b>STATUS</b><span>${esc(d.status||'ROUTED')}</span></div><div class="row"><b>BACKEND CONTINUITY</b><span>${esc(d.restart_record||'Checked; no active restart returned')}</span></div><div class="row"><b>ROUTED DEPARTMENT</b><span>${esc(d.department_code||'CHAIRMAN_OFFICE')}</span></div><div class="row"><b>THYLORA RESPONSE</b><span>${esc(d.response||'Command accepted into backend custody.')}</span></div><div class="row"><b>COMMAND ID</b><span>${esc(d.canonical_id||d.command_id||'')}</span></div>`;result.classList.add('show')};
            launch.addEventListener('click',()=>{panel.classList.add('open');launch.style.display='none';setTimeout(()=>text.focus(),80)});
            close?.addEventListener('click',()=>{panel.classList.remove('open');launch.style.display='block'});
            $('thySpineStop')?.addEventListener('click',()=>window.speechSynthesis?.cancel());
            $('thySpineHear')?.addEventListener('click',()=>{if(!('speechSynthesis' in window)){setStatus('Speech readback is not available in this browser.','bad');return}const t=result?.innerText?.trim()||status.textContent;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=1.25;window.speechSynthesis.speak(u)});
            $('thySpineTalk')?.addEventListener('click',()=>{
              const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
              if(!SR){text.focus();setStatus('Direct speech recognition is not exposed by this browser. Use the iPad keyboard microphone in this same box; no restart needed.');return}
              const r=new SR();r.lang='en-US';r.interimResults=true;r.continuous=false;let final='';
              r.onstart=()=>setStatus('Listening… speak naturally.','good');
              r.onresult=e=>{let partial='';for(let i=e.resultIndex;i<e.results.length;i++){const s=e.results[i][0].transcript;if(e.results[i].isFinal)final+=s+' ';else partial+=s}text.value=(final+partial).trim()};
              r.onerror=e=>setStatus('Voice input stopped: '+e.error+'. You can keep typing or use the iPad keyboard microphone.','bad');
              r.onend=()=>setStatus(text.value.trim()?'Voice captured. Review it or route it.':'Listening ended. You can type or use the keyboard microphone.');
              try{r.start()}catch(e){setStatus('Voice input could not start. Use the iPad keyboard microphone in this box.','bad')}
            });
            $('thySpineRoute')?.addEventListener('click',async()=>{
              const command=text.value.trim();if(!command){setStatus('Say or type the command first.','bad');return}
              const t=token();if(!t){setStatus('Protected routing needs a signed-in THYLORA session. Sign in, then route this same command.','bad');return}
              const btn=$('thySpineRoute');btn.disabled=true;setStatus('Checking backend continuity and routing…');
              try{
                const r=await fetch(URL+'/rest/v1/rpc/submit_thylora_chairman_command_v1',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+t},body:JSON.stringify({p_command_text:command})});
                const raw=await r.text();let d={};try{d=raw?JSON.parse(raw):{}}catch{d={response:raw}}
                if(!r.ok)throw new Error(d.message||d.error||raw||('HTTP '+r.status));
                render(d);setStatus('Backend checked first. Command is routed and preserved.','good');
              }catch(e){setStatus('Routing did not complete: '+e.message,'bad')}
              finally{btn.disabled=false}
            });
            console.info(MARK);
          })();
          </script>
          '''

          def patch(path):
            p=Path(path); s=p.read_text()
            if MARK in s:
              print(path, 'already patched'); return False
            if '</body>' not in s: raise SystemExit(f'{path}: no body close marker')
            s=s.replace('</body>', f'<!-- {MARK} -->\n'+css+html+common_js+'\n</body>',1)
            p.write_text(s)
            print(path,'patched')
            return True

          changed=False
          changed |= patch('dashboard-current-head.html')
          changed |= patch('app/index.html')

          # Keep app's existing Hear dock, but make the global command spine the primary voice/route surface.
          if changed:
            print('SPINE FORWARD patch completed')

      - name: Commit patched source
        run: |
          git config user.name "THYLORA Build Agent"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard-current-head.html app/index.html
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "SPINE FORWARD: voice command spine for dashboard and app"
            git push origin HEAD:main
          fi
