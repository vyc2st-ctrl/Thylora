name: Patch THYLORA dashboard R3

on:
  push:
    paths:
      - '.github/workflows/patch-dashboard-r3.yml'

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply anchored drawer and conversation UI refinements
        shell: python
        run: |
          from pathlib import Path
          p = Path('dashboard-current-head.html')
          s = p.read_text()
          old_release = 'THY-UI-20260823-0650-R2'
          new_release = 'THY-UI-20260823-0745-R3'
          if old_release not in s:
              raise SystemExit('Expected R2 release marker not found; refusing to patch a different baseline.')
          s = s.replace(old_release, new_release)
          s = s.replace(
              '.drawer{position:fixed;inset:0 auto 0 0;width:min(620px,95vw);background:#0b1017;z-index:60;border-right:1px solid var(--line);transform:translateX(-102%);transition:.2s;display:flex;flex-direction:column}',
              '.drawer{position:fixed;inset:0 auto 0 0;width:min(620px,100vw);height:100dvh;background:#0b1017;z-index:60;border-right:1px solid var(--line);transform:translate3d(-102%,0,0);transition:transform .2s ease;display:flex;flex-direction:column;overscroll-behavior:contain;touch-action:pan-y}'
          )
          s = s.replace(
              '.drawer-body{overflow:auto;flex:1;padding-bottom:30px}',
              '.drawer-body{overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;padding-bottom:calc(30px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}'
          )
          s = s.replace(
              '@media(max-width:720px){.nav-grid{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.auth .field{min-width:100%}}',
              '@media(max-width:900px){.drawer{width:100vw;max-width:none;border-right:0}.scrim{display:none!important}.nav-grid{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.auth .field{min-width:100%}.talk,.viewer{left:0;right:0;bottom:0;width:100vw;max-width:none;max-height:88dvh;border-radius:16px 16px 0 0;border-left:0;border-right:0;border-bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom))}}'
          )
          old = "function setDrawer(on){$('drawer').classList.toggle('open',on);$('scrim').classList.toggle('open',on);if(on&&token){loadModules();loadDepartments();loadPrompts()}}"
          new = "let drawerScrollY=0;function setDrawer(on){const drawer=$('drawer'),scrim=$('scrim');drawer.classList.toggle('open',on);scrim.classList.toggle('open',on);if(on){drawerScrollY=window.scrollY||document.documentElement.scrollTop||0;document.body.style.position='fixed';document.body.style.top='-'+drawerScrollY+'px';document.body.style.left='0';document.body.style.right='0';document.body.style.width='100%';document.body.style.overflow='hidden';if(token){loadModules();loadDepartments();loadPrompts()}}else{const y=drawerScrollY;document.body.style.position='';document.body.style.top='';document.body.style.left='';document.body.style.right='';document.body.style.width='';document.body.style.overflow='';window.scrollTo(0,y)}}"
          if old not in s:
              raise SystemExit('Expected R2 setDrawer function not found; refusing unsafe patch.')
          s = s.replace(old, new)
          s = s.replace('rows="4" placeholder="Speak directly to this department"', 'rows="6" maxlength="20000" placeholder="Speak directly to this department — up to 20,000 characters"')
          s = s.replace("$('talkStatus').textContent=(d.speaking_person?.full_name?d.speaking_person.full_name+' responded.':'Department responded.');", "$('talkStatus').textContent=(d.speaking_person?.full_name?d.speaking_person.full_name+' responded.':'Department responded.');")
          p.write_text(s)
      - name: Verify no-regression markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'THY-UI-20260823-0745-R3' dashboard-current-head.html
          grep -q 'thylora-department-talk' dashboard-current-head.html
          grep -q 'drawerScrollY' dashboard-current-head.html
          grep -q 'maxlength="20000"' dashboard-current-head.html
          grep -q 'All registered modules' dashboard-current-head.html
          grep -q 'Departments — speak directly' dashboard-current-head.html
      - name: Commit R3
        shell: bash
        run: |
          git config user.name 'THYLORA continuity bot'
          git config user.email 'actions@users.noreply.github.com'
          git add dashboard-current-head.html
          git commit -m 'Anchor dashboard drawer and preserve conversational R3 baseline'
          git push
